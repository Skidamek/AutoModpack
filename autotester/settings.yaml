paths:
  artifactDir: merged
  outDir: autotester/out

images:
  server: itzg/minecraft-server
  client: automodpack-autotest-client:local
  serverTagTemplate: "java{java}"

run:
  target: all
  scenario: all
  jobs: 3

server:
  memory: 2G
  env:
    EULA: "TRUE"
    ONLINE_MODE: "FALSE"
    ENABLE_AUTOPAUSE: "FALSE"
    MOTD: "amp-autotest"
    DIFFICULTY: "peaceful"
    SPAWN_ANIMALS: "false"
    SPAWN_MONSTERS: "false"
    SPAWN_NPCS: "false"
    GENERATE_STRUCTURES: "false"
    LEVEL_TYPE: "flat"
    GENERATOR_SETTINGS: "{\"lakes\":false,\"layers\":[{\"block\":\"minecraft:stone\",\"height\":1}],\"biome\":\"minecraft:plains\",\"structures\":{\"structures\":{}}}"
    SPAWN_RADIUS: "0"

serverTypes:
  fabric: FABRIC
  forge: FORGE
  neoforge: NEOFORGE

headlessmc:
  # Git repository and ref the HeadlessMC launcher is built from. ref may be a
  # branch, tag, or commit SHA; pin the upstream release for reproducible builds.
  repo: "https://github.com/headlesshq/headlessmc.git"
  ref: "2.10.0"

timeouts:
  serverStartSeconds: 180
  clientStartSeconds: 600
  # Direct Xvfb readiness measured 0.022-0.054s across five cold containers; this is a process-health tripwire.
  displayStartSeconds: 5
  # User-defined absolute ceiling for a target, independent of individual step budgets.
  caseSeconds: 1800
  downloadFileSeconds: 180
  rejoinSeconds: 90

# Loader-discovered startup helpers are detached as soon as the bridge is ready, before scenario behavior inspects ordinary mods.
clientRuntimeMods:
  1.19.2-fabric:
    - url: https://cdn.modrinth.com/data/hvFnDODi/versions/0.1.3/lazydfu-0.1.3.jar
      sha512: dc3766352c645f6da92b13000dffa80584ee58093c925c2154eb3c125a2b2f9a3af298202e2658b039c6ee41e81ca9a2e9d4b942561f7085239dd4421e0cce0a
  1.19.2-forge:
    - url: https://mediafilez.forgecdn.net/files/4327/266/lazydfu-1.19-1.0.2.jar
      sha512: b0bba36ad1d0eb72290b29af4842d80d53450fefab27ca0e92846ffefdf4857044aa5fe0294fdbf047b4344d4b66a37a334b1cdc0df5512f11d8e3f21e5daa75
  1.18.2-fabric:
    - url: https://cdn.modrinth.com/data/hvFnDODi/versions/0.1.2/lazydfu-0.1.2.jar
      sha512: 20b1cd3e62051c7d7498ecdc49912acb918fc4748d469c67c078cc97197289760e64b9339a4d4a03d175f648c8be8601d131776a9a6bdb8832cecdda6fc46498
  1.18.2-forge:
    - url: https://mediafilez.forgecdn.net/files/3544/496/lazydfu-1.0-1.18%2B.jar
      sha512: 16341b86d830766817a0705f3835e9eb73e095d91f1c27331e9b93f02021896f667e9ff6564b6ae2e75d265a18a930c65a5e9a75b513aa1aecbd491bb225dc9b

serverCache:
  enabled: true
  volumePrefix: "amp-server-cache"
  clean: false

automodpack:
  config:
    DO_NOT_CHANGE_IT: 2
    modpackHost: true
    generateModpackOnStart: true
    syncedFiles:
      - "/mods/*.jar"
      - "/kubejs/**"
      - "!/kubejs/server_scripts/**"
      - "/emotes/*"
    allowEditsInFiles:
      - "/config/**"
    overwriteEditableFiles: []
    autoExcludeServerSideMods: true
    autoExcludeUnnecessaryFiles: true
    requireAutoModpackOnClient: true
    nagUnModdedClients: false
    bindAddress: ""
    bindPort: -1
    advertisedEndpointHost: ""
    advertisedEndpointPort: -1
    disableInternalTLS: false
    connectionMode: HOLEPUNCH
    updateIpsOnEveryStart: false
    bandwidthLimit: 0
    validateSecrets: true
    secretLifetime: 336
    selfUpdater: false
