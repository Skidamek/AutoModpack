paths:
  artifactDir: merged
  outDir: autotester/out

run:
  target: 26.2-fabric
  scenario: transport,gate
  provider: local
  fastTimers: true
  prunePassed: true
  # 0 = auto (scales with CPU cores and available RAM)
  jobs: 0

jvm:
  serverMemory: 1G
  clientMemory: 1G
  # C1-only compilation cuts short-lived test JVM startup time and CPU usage dramatically.
  fastStartup: true

headlessmc:
  repo: "https://github.com/headlesshq/headlessmc"
  ref: "3.0.0-RC9"

timeouts:
  serverStartSeconds: 180
  clientStartSeconds: 300
  caseSeconds: 600
  bridgeCallSeconds: 20

server:
  properties:
    online-mode: "false"
    white-list: "false"
    enforce-whitelist: "false"
    enable-rcon: "true"
    difficulty: "peaceful"
    spawn-animals: "false"
    spawn-monsters: "false"
    spawn-npcs: "false"
    generate-structures: "false"
    level-type: "minecraft:flat"
    generator-settings: '{"lakes":false,"layers":[{"block":"minecraft:stone","height":1}],"biome":"minecraft:plains","structures":{"structures":{}}}'
    spawn-protection: "0"
    view-distance: "4"
    simulation-distance: "4"
    motd: "amp-autotest-v2"

automodpack:
  config:
    modpack-host: true
    generate-modpack-on-start: true
    require-modpack: true
    self-updater: false
    nag:
      enabled: false
    network:
      connection-mode: HOLEPUNCH
      bind-address: ""
      bind-port: -1
      advertised-host: ""
      advertised-port: -1
      disable-internal-tls: false
      bandwidth-limit: 0
    secrets:
      validate: true
      lifetime-hours: 336
    modpack:
      auto-exclude-server-side-mods: METADATA
    groups:
      main:
        selection: REQUIRED
        from-server:
          - "mods/*.jar"
          - "config/**"
          - "kubejs/**"
          - "!kubejs/server_scripts/**"
          - "emotes/*"
        exclude:
          - "**/.*"
          - "**/.*/**"
          - "**/*.{tmp,disabled,bak}"
          - "kubejs/server_scripts/**"
        editable:
          - "config/**"

windowsVm:
  # Default location for the KVM/QEMU golden image and live snapshot.
  dir: "~/.cache/automodpack-autotest/windows-vm"
  memory: "6G"
  cpus: 6
  machine: "pc"
  diskInterface: "ide"
  nic: "e1000e"
  tpm: true
  snapshotName: "ready"
  agentPort: 19450
