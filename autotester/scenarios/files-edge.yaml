topology:
  server:
    memory: 2G
    env:
      ENABLE_ROLLING_LOGS: "false"
    automodpack:
      config:
        # Replaces the permissive /config/** default: only this one file tolerates local edits.
        allowEditsInFiles: ["/config/edge/editable.txt"]
        # The zero-byte fixture is the point: keep the empty_file auto-exclusion from dropping it.
        autoExcludeUnnecessaryFiles: false
        # The bundled waiting track, re-hosted as the server's custom one so the client exercises GET /music.
        waitingMusicFile: automodpack/waiting-music.ogg

serverFiles:
  modpackName: files-edge
  # The mod's own bundled track, re-hosted as the server's custom one, so the client exercises GET /music end to end.
  waitingMusic: client-jar
  marker: config/amp-autotest-marker.json
