id: restart-deletion
description: |
  Publish a generation that removes one file, apply it, and restart: the removed
  file must stay gone and the rest of the projection must still load.
platforms: [linux, windows]
renderClient: true

flow:
  - use: boot
  - use: accept_certificate
  - use: download_modpack
  - do: verify_files
    name: verify the first generation's files
  - do: publish_server_generation
    name: publish a generation that removes the doomed file
    generation: 1
  - do: disconnect
    name: leave the game for the published update
  - do: connect
    name: connect to the published generation
  - do: wait_for
    name: show the published generation review
    timeout: 90s
    until:
      all:
        - screen: UpdatePreviewScreen
        - element: { text: Update, enabled: true }
  - do: click
    name: accept the published generation
    select: { text: Update }
  - do: wait_generation
    name: wait for the committed generation
    timeout: 300s
  - do: wait_for
    name: wait for the post-update restart
    timeout: 60s
    until: { screen: RestartScreen }
  - do: click
    name: restart onto the published generation
    select: { text: "Yes, close the game" }
    timeout: 20s
  - do: wait_client_exit
    name: wait for the restarted client to close
  - do: launch_client
    name: relaunch the client without connecting
  - do: wait_bridge
    name: wait for the offline bridge
  - do: assert
    name: the removed file stays gone after the restart
    that: { file_gone: "${active_dir}/config/amp-autotest-doomed.cfg" }
  - do: assert_file_content
    name: the surviving file is still in the projection
    path: "${active_dir}/config/amp-autotest-survivor.json"
    content: "survivor\n"
  - do: quit
    name: quit after restart

serverFiles:
  modpackName: amp-autotest
  marker: config/amp-autotest-marker.json
  files:
    - { path: config/amp-autotest-doomed.cfg, content: "doomed\n" }
    - { path: config/amp-autotest-survivor.json, content: "survivor\n" }
  generations:
    - patchNotes: "Initial release with the doomed file and the survivor."
      files:
        - { group: main, path: config/amp-autotest-doomed.cfg, content: "doomed\n" }
        - { group: main, path: config/amp-autotest-survivor.json, content: "survivor\n" }
    - patchNotes: "Remove the doomed file; keep the survivor."
      files:
        - { group: main, path: config/amp-autotest-survivor.json, content: "survivor\n" }
