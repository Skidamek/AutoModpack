id: state-history
description: |
  Screenshots and end-to-end checks for the instance timeline: install and
  update snapshots appear, Files shows the parent diff, and Restore this state
  unlocks for a past snapshot. Restore is an offline checkout, not pack-history revert.
renderClient: true

flow:
  - use: boot
  - use: accept_certificate
  - use: download_modpack
  - use: restart_client
  - use: rejoin
  - do: publish_server_generation
    name: publish a changed generation so the timeline gets a second checkpoint
    generation: 1
  - do: disconnect
    name: leave the game for the published update
  - do: connect
    name: connect to the published generation
  - do: wait_for
    name: show the published generation review
    timeout: 90s
    until:
      all:
        - screen: UpdatePreviewScreen
        - element: { text: Update, enabled: true }
  - do: click
    name: accept the published generation
    select: { text: Update }
  - do: wait_file_content
    name: wait for the changed file
    path: "${active_dir}/config/amp-autotest-alpha.txt"
    content: "amp-autotest-alpha-v2\n"
    timeout: 300s
  - do: wait_generation
    name: wait for the committed head generation
    timeout: 300s
  - do: wait_for
    name: wait for the post-update restart
    timeout: 60s
    until: { screen: RestartScreen }
  - do: click
    name: restart onto the head generation
    select: { text: "Yes, close the game" }
    timeout: 20s
  - do: wait_client_exit
    name: wait for the head restart to exit
  - do: launch_client
    name: relaunch the head client without the server
  - do: wait_bridge
    name: wait for the offline bridge
  - use: open_multiplayer
  - use: open_pack_manager
  - do: screenshot
    name: capture the pack manager with the state history button
    file: state-history-manager
  - do: click
    name: open the state history
    select: { key: automodpack.management.stateHistory }
  - do: wait_for
    name: wait for the state history timeline
    timeout: 20s
    until: { screen: StateHistoryScreen }
  - do: screenshot
    name: capture the state history timeline
    file: state-history-timeline
  - do: click
    name: select the install checkpoint
    select: { text: "Installed modpack" }
  - do: wait_for
    name: wait until the checkpoint's restorability is resolved
    timeout: 30s
    until:
      all:
        - element: { key: automodpack.stateHistory.restore, enabled: true }
        - element: { key: automodpack.stateHistory.files, enabled: true }
  - do: screenshot
    name: capture the selected install checkpoint with its restore offer
    file: state-history-entry-selected
  - do: click
    name: open the checkpoint's tracked files
    select: { key: automodpack.stateHistory.files }
  - do: wait_for
    name: wait for the file list
    timeout: 20s
    until: { element: { key: automodpack.back, enabled: true } }
  - do: screenshot
    name: capture the checkpoint's file list
    file: state-history-files
  - do: click
    name: select a tracked file
    select: { text: "config/amp-autotest-alpha.txt" }
  - do: wait_for
    name: wait until the owned file's restore gate resolves
    timeout: 20s
    until: { element: { key: automodpack.stateHistory.restoreFile, enabled: false } }
  - do: screenshot
    name: capture the selected file with the owned gate holding
    file: state-history-file-gated
  - do: click
    name: return to the timeline
    select: { key: automodpack.back }
  - do: wait_for
    name: show the timeline again
    timeout: 20s
    until: { screen: StateHistoryScreen }
  - do: click
    name: select the install checkpoint again
    select: { text: "Installed modpack" }
  - do: wait_for
    name: wait for the whole-state restore to unlock
    timeout: 30s
    until: { element: { key: automodpack.stateHistory.restore, enabled: true } }
  - do: screenshot
    name: capture the timeline with restore ready
    file: state-history-restore-ready
  - do: click
    name: restore the install snapshot onto the running instance
    select: { key: automodpack.stateHistory.restore }
  - do: wait_file_content
    name: wait until the install generation file is back
    path: "${active_dir}/config/amp-autotest-alpha.txt"
    content: "amp-autotest-alpha\n"
    timeout: 120s
  - do: click
    name: leave the timeline for the pack manager
    select: { text: Back }
  - do: wait_for
    name: show the pack still listed after restore
    timeout: 20s
    until:
      all:
        - screen: InstalledModpacksScreen
        - element: { text: amp-autotest }
  - do: click
    name: open the restored pack
    select: { text: amp-autotest }
  - do: wait_for
    name: show resume syncing because restore detached the pack
    timeout: 20s
    until:
      all:
        - screen: ModpackSettingsScreen
        - element: { key: automodpack.management.resumeSyncing, enabled: true }
  - do: screenshot
    name: capture the pack still installed and detached after instance restore
    file: state-history-restored-detached
  - do: quit
    name: quit the client

topology:
  server:
    memory: 2G
    env:
      ENABLE_ROLLING_LOGS: "false"

serverFiles:
  modpackName: amp-autotest
  marker: config/amp-autotest-marker.json
  generations:
    - files:
        - { path: config/amp-autotest-alpha.txt, content: "amp-autotest-alpha\n" }
        - { path: config/amp-autotest-beta.json, content: '{"id":"beta","value":42}' }
    - files:
        - { path: config/amp-autotest-alpha.txt, content: "amp-autotest-alpha-v2\n" }
        - { path: config/amp-autotest-beta.json, content: '{"id":"beta","value":43}' }
        - { path: config/amp-autotest-gamma.cfg, content: "gamma=true\n" }
