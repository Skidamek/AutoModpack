id: no-modpack-server
description: |
  A server whose group rules match no publishable file has no modpack to host.
  That is a state, not a failure: the server finishes loading, logs the one line
  that says why there is nothing to sync, and refuses to publish the empty
  generation that would turn every joining client's mod list into deletions. A
  modded client therefore joins in-game over the vanilla login instead of being
  sent into a manifest fetch that cannot succeed.
renderClient: true

flow:
  # The modpack host never starts without a generation, so there is no TLS
  # fingerprint to read and no certificate to accept: the join is vanilla.
  - do: launch_server
    name: start server
  - do: launch_client
    name: start client (boots in parallel with the server)
  - do: wait_server
    name: wait for the server to finish loading with nothing to sync
  - do: assert
    name: verify the server logged why it hosts no modpack
    that: { log: { container: server, matches: 'Nothing to sync: all 1 files the scan found were excluded' } }
  - do: wait_bridge
    name: wait for the client test bridge
  - do: connect
    name: connect to the server
  - do: wait_join
    name: verify a modded client joins a packless server in-game
  - do: assert
    name: verify the join was recorded as packless and synced nothing
    that:
      all:
        - file_gone: "${active_dir}/${marker}"
        - log: { container: server, matches: 'joined a server that hosts no modpack' }
  - do: quit
    name: quit the client

topology:
  server:
    memory: 2G
    env:
      ENABLE_ROLLING_LOGS: "false"
    automodpack:
      config:
        # One required group whose every file is carved out by an exclude rule:
        # the group is declared, the catalogue is empty, and nothing is published.
        modpack:
          General:
            main:
              exclude: ["**"]

serverFiles:
  modpackName: amp-autotest
  marker: config/amp-autotest-marker.json
