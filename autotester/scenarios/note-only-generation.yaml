id: note-only-generation
description: |
  Publish a generation whose files are identical and whose patch notes changed.
  After approval, the committed no-restart update must leave the transient
  preparing screen.
renderClient: true

flow:
  - use: boot
  - use: accept_certificate
  - use: download_modpack
  - do: wait_generation
    name: wait for the initial generation
    patchNotes: "Initial note-only fixture."
    timeout: 300s
  - use: restart_client
  - use: rejoin
  - do: publish_server_generation
    name: publish identical files with new patch notes
    generation: 1
  - do: disconnect
    name: leave before checking the note-only generation
  - do: connect
    name: connect to the note-only generation
  - do: wait_for
    name: show the note-only generation review
    timeout: 90s
    until:
      all:
        - screen: UpdatePreviewScreen
        - element: { text: Update, enabled: true }
        - element: { text: View all patch notes, enabled: true }
  - do: click
    name: accept the note-only generation
    select: { text: Update }
  - do: wait_generation
    name: commit the note-only generation
    patchNotes: "Second release with notes only."
    timeout: 90s
  - do: wait_for
    name: leave the transient preparing screen after the no-restart update
    timeout: 10s
    until: { screen: Play Multiplayer }
  - do: click
    name: open the active modpack settings
    select: { text: Modpack settings }
  - do: wait_for
    name: keep lifecycle actions out of settings and align an unchanged disabled save action
    until:
      all:
        - screen: ModpackSelectionScreen
        - element: { text: Pack manager, enabled: true }
        - element: { text: Files, enabled: true }
        - element: { text: Save, enabled: false }
        - no_element: { text: Deactivate }
        - no_element: { text: Remove }
  - do: screenshot
    name: capture the aligned settings rows
    file: note-only-settings-aligned
  - do: click
    name: open downloaded generation history
    select: { text: History }
  - do: wait_for
    name: show clickable generation rows and the complete file catalogue action
    until:
      all:
        - screen: ContentHistoryScreen
        - element: { text: Patch notes, enabled: true }
        - element: { text: Files, enabled: true }
  - do: screenshot
    name: capture clickable generation history
    file: note-only-clickable-history
  - do: click
    name: open the latest generation catalogue diff
    select: { text: Updated }
  - do: wait_for
    name: show the complete generation diff
    until:
      all:
        - screen: ChangeBrowserScreen
        - element: { text: Back, enabled: true }
  - do: screenshot
    name: capture the git-like generation diff
    file: note-only-generation-diff
  - do: click
    name: return to generation history
    select: { text: Back }
  - do: click
    name: open the complete modpack-owned file catalogue
    select: { text: Files }
  - do: wait_for
    name: show all installed modpack-owned files
    until:
      all:
        - screen: ChangeBrowserScreen
        - element: { text: Back, enabled: true }
  - do: screenshot
    name: capture the complete owned-file catalogue
    file: note-only-owned-files
  - do: click
    name: return to generation history from owned files
    select: { text: Back }
  - do: click
    name: return to modpack settings from history
    select: { text: Back }
  - do: click
    name: open per-pack lifecycle actions
    select: { text: Pack manager }
  - do: wait_for
    name: show the active pack in the manager
    until:
      all:
        - screen: InstalledModpacksScreen
        - element: { text: Note-only Test P, enabled: true }
  - do: screenshot
    name: capture the installed pack list
    file: note-only-pack-list
  - do: click
    name: open the installed pack details
    select: { text: Note-only Test P }
  - do: wait_for
    name: show active pack lifecycle actions in its details
    until:
      all:
        - screen: ModpackDetailsScreen
        - element: { text: Update, enabled: true }
        - element: { text: Deactivate, enabled: true }
        - element: { text: Remove, enabled: true }
        - element: { text: Back, enabled: true }
  - do: screenshot
    name: capture active pack lifecycle actions
    file: note-only-pack-details
  - do: click
    name: open per-pack storage actions
    select: { text: Storage }
  - do: wait_for
    name: show per-pack storage actions
    until:
      all:
        - screen: ModpackStorageScreen
        - element: { text: Clean local storage, enabled: true }
  - do: screenshot
    name: capture per-pack storage actions
    file: note-only-pack-storage
  - do: click
    name: return to active pack details
    select: { text: Back }
  - do: click
    name: return to the installed pack list
    select: { text: Back }
  - do: click
    name: return to active pack settings
    select: { text: Back }
  - do: click
    name: leave the original settings route
    select: { text: Back }
  - do: wait_for
    name: return to the multiplayer parent
    until: { screen: Play Multiplayer }
  - do: click
    name: reopen active modpack settings
    select: { text: Modpack settings }
  - do: click
    name: reopen per-pack lifecycle actions
    select: { text: Pack manager }
  - do: click
    name: open the active pack details
    select: { text: Note-only Test P }
  - do: wait_for
    name: restore the pack manager actions
    until:
      all:
        - screen: ModpackDetailsScreen
        - element: { text: Update, enabled: true }
  - do: click
    name: check manually for another update
    select: { text: Update }
  - do: wait_for
    name: report that the installed generation is current
    timeout: 30s
    until:
      all:
        - screen: ModpackDetailsScreen
        - element: { text: Up to date, enabled: false }
  - do: click
    name: preview deactivation
    select: { text: Deactivate }
  - do: wait_for
    name: show the deactivation review
    until:
      all:
        - screen: UpdatePreviewScreen
        - element: { text: Deactivate, enabled: true }
  - do: click
    name: deactivate while keeping the installed pack
    select: { text: Deactivate }
  - do: wait_for
    name: require a restart after deactivation
    until: { screen: RestartScreen }
  - do: assert
    name: verify deactivation cleared active state
    that: { file_gone: automodpack/client/active-state.json }
  - do: assert
    name: verify deactivation restored the live client file
    that: { file_gone: config/amp-note-only.txt }
  - do: click
    name: accept the required deactivation restart
    select: { role: button, index: 1 }
  - do: wait_client_exit
    name: wait for the deactivated client to close
  - do: launch_client
    name: relaunch without an active modpack
  - do: wait_bridge
    name: wait for the relaunched client test bridge
  - use: open_multiplayer
  - do: wait_for
    name: replace settings with the direct pack-manager entry while inactive
    until:
      all:
        - screen: Play Multiplayer
        - element: { text: Pack manager, enabled: true }
        - no_element: { text: Modpack settings }
  - do: click
    name: open the retained inactive pack directly
    select: { text: Pack manager }
  - do: wait_for
    name: verify deactivation retained an activatable installed pack
    until:
      all:
        - screen: InstalledModpacksScreen
        - element: { text: Note-only Test P }
  - do: click
    name: open the inactive pack details
    select: { text: Note-only Test P }
  - do: wait_for
    name: show inactive pack lifecycle actions
    until:
      all:
        - screen: ModpackDetailsScreen
        - element: { text: Activate, enabled: true }
        - element: { text: Remove, enabled: true }
  - do: click
    name: inspect inactive pack features
    select: { text: Modpack settings }
  - do: wait_for
    name: keep the details route available from feature settings
    until:
      all:
        - screen: ModpackSelectionScreen
        - element: { text: Back, enabled: true }
  - do: click
    name: return to inactive pack details
    select: { text: Back }
  - do: click
    name: return to the inactive pack list
    select: { text: Back }
  - do: click
    name: open local storage after deactivation
    select: { text: Local storage }
  - do: click
    name: compact CAS with an uncached optional catalogue object
    select: { text: Clean local storage }
  - do: wait_for
    name: complete inactive-pack CAS compaction
    timeout: 120s
    until:
      all:
        - screen: ClientStorageMaintenanceScreen
        - element: { text: Clean local storage, enabled: true }
  - do: click
    name: return to the inactive pack manager after compaction
    select: { text: Back }
  - do: wait_for
    name: keep the deactivated pack available after compaction
    until:
      all:
        - screen: InstalledModpacksScreen
        - element: { text: Note-only Test P, enabled: true }
  - do: click
    name: reopen inactive pack details after compaction
    select: { text: Note-only Test P }
  - do: click
    name: activate the retained pack again
    select: { text: Activate }
  - do: wait_for
    name: show the cached activation preview
    until:
      all:
        - screen: UpdatePreviewScreen
        - element: { text: Update, enabled: true }
  - do: click
    name: accept the cached activation
    select: { text: Update }
  - do: wait_for
    name: wait for the reactivated pack restart
    until: { screen: RestartScreen }
  - do: assert_file_content
    name: verify reactivation restored the retained pack file
    path: config/amp-note-only.txt
    content: "unchanged\n"
  - do: quit
    name: quit after the reactivation flow completed

topology:
  server:
    memory: 2G
    env:
      ENABLE_ROLLING_LOGS: "false"
    automodpack:
      config:
        groups:
          main:
            displayName: Core
            required: true
            defaultSelected: true
            syncedFiles: ["/config/amp-note-only.txt"]
          optional:
            displayName: Optional Feature
            syncedFiles: ["/config/amp-note-only-optional.txt"]

serverFiles:
  modpackName: Note-only Test Pack
  marker: config/amp-note-only-marker.json
  generations:
    - patchNotes: "Initial note-only fixture."
      files:
        - { group: main, path: config/amp-note-only.txt, content: "unchanged\n" }
        - { group: optional, path: config/amp-note-only-optional.txt, content: "never selected\n" }
    - patchNotes: "Second release with notes only."
      files:
        - { group: main, path: config/amp-note-only.txt, content: "unchanged\n" }
        - { group: optional, path: config/amp-note-only-optional.txt, content: "never selected\n" }
