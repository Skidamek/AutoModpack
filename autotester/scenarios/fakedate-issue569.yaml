id: fakedate-issue569
description: |
  Reproduction and regression for issue #569. FakeDate is an early-service wrapper jar: the
  outer jar holds a transformation service, a mod locator, a dependency locator and an
  early-window provider, the real mod lives in the inner fakedate-forge-mod.jar, and the outer
  MANIFEST advertises MixinConfigs: fakedate.mixins.json - a file that exists nowhere in the
  jar. A plain install never reads that manifest: FML excludes service-claimed jars from mod
  discovery and the jar's own locator loads the inner jar instead. Staged into the active
  projection the wrapper is outside that machinery, so the early-window rule must force-copy
  it into standard mods/. Without the copy FML parses the outer jar as a mod, Mixin registers
  the missing config and the client dies with MixinInitialisationError (the reported crash).

  First boot: the launch apply copies the jar into standard mods/ and asks for a restart.
  Second boot: FML excludes the wrapper from mod discovery, the jar's own locator loads the
  inner jar, and the game launches with no MixinInitialisationError in either boot's log.

network: host
mode: client-only

timeouts:
  clientStartSeconds: 1200

targets:
  - 1.20.1-forge

flow:
  - do: stage_modpack
    name: stage FakeDate into the active projection (NOT standard mods/)
    config:
      updateSelectedModpackOnLaunch: true
    mods:
      - url: https://cdn.modrinth.com/data/lW22drsL/versions/s23frY6x/fakedate-1.1.0%2B1.20.1-forge.jar
        sha512: 20865478765993bdcd65cf7b5a2f1e2d88f1cad77e3bdaef0bfae8c2d309dee6fa9b87bbe0859a6e4b144f5a52c3daf1b9e610100a301d4431d3dcf7347f194b
  - do: launch_client
    name: first boot - the apply path must force-copy the wrapper into standard mods/
  - do: wait_for
    name: force-copy completed, restart requested, no mixin crash
    timeout: 420s
    until:
      all:
        - file: mods/fakedate-1.1.0+1.20.1-forge.jar
        - log:
            container: client
            matches_all:
              - 'Restart required because: standard-directory mods were copied or updated'
              - 'Please restart the game to apply updates!'
            not_matches: 'MixinInitialisationError'
  - do: wait_exit
    name: the restart request exits the client in headless preload
    expect: any
    timeout: 120s
  - do: assert
    name: the wrapper was never parsed as a mod (first boot)
    that:
      log:
        container: client
        not_matches: 'MixinInitialisationError'
  - do: launch_client
    name: second boot - the copied jar loads natively from standard mods/
  - do: wait_for
    name: Preload passes through and ModLauncher launches the game
    timeout: 420s
    until:
      log:
        container: client
        matches_all:
          - 'AutoModpack prelaunched'
          - "Launching target 'forgeclient'"
        not_matches: 'MixinInitialisationError'
  - use: finish_client_only
  - do: assert
    name: the wrapper manifest never reaches Mixin (second boot)
    that:
      all:
        - log:
            container: client
            not_matches: 'MixinInitialisationError'
        - log:
            file: logs/debug.log
            not_matches: 'Registering mixin config: fakedate\.mixins\.json'

serverFiles:
  modpackName: amp-autotest
  marker: config/amp-autotest-marker.json
