id: sync
description: |
  Full round trip: boot, trust the certificate, sync the modpack, verify the files,
  restart the client, rejoin, restart the server with unchanged content to prove the
  modpack stays hosted, rejoin again, and confirm the player reaches the game.
renderClient: true

flow:
  - use: boot
  - use: accept_certificate
  - use: download_modpack
  - do: verify_files
    name: verify all synced files are present
  - do: assert
    name: standard mods/ dir holds only the AutoModpack loader jar (modpack mods stay in the active projection)
    that:
      only_files:
        dir: mods
        patterns: ["automodpack.jar"]
  - use: restart_client
  - do: restart_server
    name: restart the server with unchanged modpack content
  - do: assert
    name: unchanged server restart keeps the modpack hosted
    that:
      log:
        container: server
        not_matches: 'No current generation record is prepared'
  - use: rejoin
  - do: quit
    name: quit the client

topology:
  server:
    memory: 2G
    env:
      ENABLE_ROLLING_LOGS: "false"
    modrinth:
      projects:
        - ferrite-core?

serverFiles:
  modpackName: amp-autotest
  marker: config/amp-autotest-marker.json
  files:
    - path: config/amp-autotest-alpha.txt
      content: "amp-autotest-alpha\n"
    - path: config/amp-autotest-beta.json
      content: '{"id":"beta","value":42}'
    - path: config/amp-autotest-gamma.cfg
      content: "alpha=true\nbeta=false\n"
