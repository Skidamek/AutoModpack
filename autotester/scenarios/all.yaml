id: all
description: |
  The release gate: exercise secure bootstrap authentication, advanced group
  review, patch-note history, cached pack switching, and a published
  changed/removed generation in one flow. The focused scenarios remain
  available for faster diagnosis; this is the default confidence path.
renderClient: true

releaseGate:
  covers:
    - bootstrap
    - groups
    - patch-notes
    - multiplayer-settings
    - pack-switching
    - generation-update
    - conflict-preservation
    - quarantine-restoration
    - storage-maintenance
    - server-history-compaction
    - fresh-generation-deletion
    - removal
    - secure-bootstrap

flow:
  - use: boot_with_bootstrap
  - do: assert_preload_rejected
    name: verify anonymous bootstrap preload cannot bypass secure authentication
  - do: wait_for
    name: verify bootstrap seeded trust without a TOFU prompt
    timeout: 90s
    until:
      all:
        - log:
            container: client
            matches: 'Imported seeded certificate pin for origin'
            not_matches: 'Received untrusted certificate|Asking user to verify certificate'
  - do: write_file
    name: seed an ordinary local baseline before the first server-owned install
    path: config/amp-autotest-baseline.json
    content: "local-baseline\n"
  - use: connect_to_server
  - do: wait_for
    name: show the first connection review
    timeout: 90s
    until:
      all:
        - screen: FirstConnectScreen
        - no_element: { text: verify }
  - do: click
    name: open advanced group selection
    select: { text: customize groups }
  - do: wait_for
    name: show group selection
    until:
      all:
        - screen: ModpackSelectionScreen
        - element: { text: Core }
        - element: { text: Visuals }
        - element: { text: Client }
  - do: screenshot
    name: capture group selection at the supported 320x240 logical size
    file: all-groups-page-one
  - do: click
    name: toggle the derived client category
    select: { text: client }
  - do: click
    name: show dependency and conflict groups
    select: { text: Next > }
  - do: wait_for
    name: show extras and platform groups
    until:
      all:
        - element: { text: Addon }
        - element: { text: Alternative }
        - element: { text: Platform }
  - do: click
    name: select a group with a dependency
    select: { text: Addon }
  - do: wait_for
    name: return to the dependency selected by Addon
    until: { element: { text: "< Prev" } }
  - do: click
    name: inspect the dependency selected by Addon
    select: { text: "< Prev" }
  - do: wait_for
    name: show the dependency explanation
    until: { element: { text: "[+] Visuals (" } }
  - do: click
    name: return to dependency and conflict groups
    select: { text: "Next >" }
  - do: click
    name: select the conflicting alternative
    select: { text: Alternative }
  - do: wait_for
    name: show the conflict explanation
    until: { element: { text: conflict } }
  - do: click
    name: inspect unavailable platform filtering
    select: { text: Next > }
  - do: wait_for
    name: show the unavailable platform group
    until:
      all:
        - element: { text: Windows-only }
        - element: { text: unavailable }
  - do: screenshot
    name: capture unavailable and conflict group states
    file: all-groups-platform
  - do: click
    name: restore default group selection
    select: { text: Defaults }
  - do: click
    name: preview the default target
    select: { text: preview target }
  - do: wait_for
    name: show the first update preview
    timeout: 90s
    until:
      all:
        - screen: UpdatePreviewScreen
        - element: { text: Update, enabled: true }
        - element: { text: View all patch notes, enabled: true }
  - do: screenshot
    name: capture first review with latest patch notes
    file: all-first-review
  - do: click
    name: open connected generation patch-note history from review
    select: { text: View all patch notes }
  - do: wait_for
    name: show patch-note history from review
    until: { screen: PatchNotesHistoryScreen }
  - do: screenshot
    name: capture connected patch-note history
    file: all-first-patch-history
  - do: click
    name: return to first review
    select: { text: Back }
  - do: click
    name: accept the complete bootstrap
    select: { text: Update }
  - do: wait_file
    name: wait for the projected modpack marker
    path: "${active_dir}/${marker}"
    timeout: 300s
  - do: wait_generation
    name: wait for the committed bootstrapped generation
    patchNotes: "Initial release: core content and optional client groups."
    timeout: 300s
  - do: assert_authenticated_secret
    name: verify authenticated login persisted the server-issued secret
  - do: assert_generation
    name: verify advanced group metadata and latest notes were installed
    groups:
      main: { required: true, defaultSelected: true }
      visual: { required: false, defaultSelected: true, tag: client, requires: [main] }
      addon: { required: false, defaultSelected: false, tag: extras, requires: [visual] }
      alternative: { required: false, defaultSelected: false, tag: extras, breaksWith: [visual] }
      windows: { required: false, compatiblePlatforms: [windows], tag: platform }
    patchNotes: "Initial release: core content and optional client groups."
  - do: wait_for
    name: wait for restart review
    until: { screen: RestartScreen }
  - do: screenshot
    name: capture completed bootstrap summary
    file: all-bootstrap-complete
  - do: click
    name: open connected changelog
    select: { text: view changelogs }
  - do: wait_for
    name: show connected generation history
    until: { screen: ChangelogScreen }
  - do: screenshot
    name: capture connected generation history
    file: all-connected-history
  - do: click
    name: open all connected patch notes
    select: { text: View all patch notes }
  - do: wait_for
    name: show all connected patch notes
    until: { screen: PatchNotesHistoryScreen }
  - do: screenshot
    name: capture all connected patch notes
    file: all-connected-patch-history
  - do: click
    name: return to connected changelog
    select: { text: Back }
  - do: click
    name: return to completed update
    select: { text: Back }
  - do: click
    name: restart after bootstrap
    # RestartScreen adds buttons in this stable semantic order: cancel, confirm,
    # changelog. Select the confirm action by role/index because its label is
    # localized (for example, "Yes, close the game").
    select: { role: button, index: 1 }
  - do: wait_client_exit
    name: wait for bootstrap restart
  - use: rejoin

  - do: seed_unowned_local_file
    name: seed an unowned local file for preservation coverage
    path: mods/local-unowned.jar
    fixture: { modId: amp_autotest_unowned, version: "1.0.0-local-unowned", marker: unowned-local }
  # A second complete record is cached while A is active. The manager path
  # below proves that selecting a row does not activate it before review.
  - do: stage_modpack
    name: stage a second complete cached pack record
    recordOnly: true
    packId: packbbb
    packName: Pack B
    patchNotes: "Cached Pack B fixture."
    files:
      - { path: config/pack-b.txt, content: "pack-b\n" }
      - { path: config/pack-shared-editable.txt, content: "pack-b-default\n", editable: true }
      # This is a real metadata-only archive with the same mod ID as the local
      # seed below. It carries Fabric, Forge, and NeoForge metadata so the
      # FileInspection planner recognizes it on every supported loader.
      - path: mods/amp-autotest-conflict.jar
        fixture: { modId: amp_autotest_conflict, version: "2.0.0-server", marker: server }
  - do: seed_same_path_conflict
    name: seed the local payload at the server-owned mods path
    path: mods/amp-autotest-conflict.jar
    fixture: { modId: amp_autotest_conflict, version: "1.0.0-local", marker: local }
  - do: write_file
    name: make a Pack A local edit to the shared editable config
    path: config/pack-shared-editable.txt
    content: "pack-a-local\n"
  - do: assert_file_content
    name: verify the Pack A local edit is live before switching
    path: config/pack-shared-editable.txt
    content: "pack-a-local\n"
  - do: assert_file_content
    name: verify Pack A projection still contains its server default
    path: "${active_dir}/config/pack-shared-editable.txt"
    content: "pack-a-default\n"
  - do: disconnect
    name: leave the active pack without changing it
  - use: open_multiplayer
  - use: open_pack_manager
  - do: wait_for
    name: show both installed packs without activating the row
    until:
      all:
        - element: { text: Pack A }
        - element: { text: Pack B }
        - element: { text: active }
  - do: click
    name: open Pack B for review only
    select: { text: Pack B }
  - do: wait_for
    name: show Pack B review settings
    until:
      all:
        - screen: ModpackSelectionScreen
        - element: { text: Review pack switch }
  - do: click
    name: review the A to B cached switch
    select: { text: Review pack switch }
  - do: wait_for
    name: show cached switch preview
    until:
      all:
        - screen: UpdatePreviewScreen
        - element: { text: Update, enabled: true }
  - do: screenshot
    name: capture A to B switch review
    file: all-switch-a-to-b
  - do: click
    name: accept the A to B switch
    select: { text: Update }
  - do: wait_for
    name: wait for A to B restart
    until: { screen: RestartScreen }
  - do: click
    name: restart into Pack B
    select: { role: button, index: 1 }
  - do: wait_client_exit
    name: wait for Pack B restart
  - do: launch_client
    name: relaunch after Pack B switch
  - do: wait_bridge
    name: wait for Pack B bridge
  - do: assert_mod_fixture
    name: verify the unowned local mod survived A to B
    path: mods/local-unowned.jar
    fixture: { modId: amp_autotest_unowned, version: "1.0.0-local-unowned", marker: unowned-local }
  - do: assert_file_content
    name: verify Pack B payload is active after accepting the switch
    path: "${active_dir}/config/pack-b.txt"
    content: "pack-b\n"
  - do: assert_mod_fixture
    name: verify the server-owned valid mod is active for Pack B
    path: "${active_dir}/mods/amp-autotest-conflict.jar"
    fixture: { modId: amp_autotest_conflict, version: "2.0.0-server", marker: server }
  - do: assert_quarantine_payload
    name: verify the local collision payload was preserved in quarantine
    packId: packbbb
    fixture: { modId: amp_autotest_conflict, version: "1.0.0-local", marker: local }
  - do: assert
    name: verify the local same-ID source was moved out of mods
    that: { file_gone: mods/amp-autotest-conflict.jar }
  - do: assert
    name: verify Pack A only payload is gone while Pack B is active
    that: { file_gone: "${active_dir}/config/pack-a-only.txt" }
  - do: write_file
    name: make a Pack B local edit to the shared editable config
    path: config/pack-shared-editable.txt
    content: "pack-b-local\n"
  - do: assert_file_content
    name: verify the Pack B local edit is live before switching back
    path: config/pack-shared-editable.txt
    content: "pack-b-local\n"
  - do: assert_file_content
    name: verify Pack B projection still contains its server default
    path: "${active_dir}/config/pack-shared-editable.txt"
    content: "pack-b-default\n"
  - use: open_multiplayer
  - use: open_pack_manager
  - do: click
    name: open Pack A for the reverse switch
    select: { text: Pack A }
  - do: wait_for
    name: show Pack A review settings
    until: { element: { text: Review pack switch } }
  - do: click
    name: review the B to A cached switch
    select: { text: Review pack switch }
  - do: wait_for
    name: show reverse cached switch preview
    until: { element: { text: Update, enabled: true } }
  - do: screenshot
    name: capture B to A switch review
    file: all-switch-b-to-a
  - do: click
    name: accept the B to A switch
    select: { text: Update }
  - do: wait_for
    name: wait for B to A restart
    until: { screen: RestartScreen }
  - do: click
    name: restart into Pack A
    select: { role: button, index: 1 }
  - do: wait_client_exit
    name: wait for reverse switch restart
  - use: rejoin
  - do: assert_mod_fixture
    name: verify the unowned local mod survived B to A
    path: mods/local-unowned.jar
    fixture: { modId: amp_autotest_unowned, version: "1.0.0-local-unowned", marker: unowned-local }
  - do: assert_file_content
    name: verify the Pack A only payload is restored after the reverse switch
    path: "${active_dir}/config/pack-a-only.txt"
    content: "pack-a\n"
  - do: assert_file_content
    name: verify switching back restored the Pack A local edit
    path: config/pack-shared-editable.txt
    content: "pack-a-local\n"
  - do: assert_file_content
    name: verify Pack A overlay remains isolated from Pack B
    path: "automodpack/client/overlays/${bootstrap_modpack_id}/config/pack-shared-editable.txt"
    content: "pack-a-local\n"
  - do: assert_file_content
    name: verify Pack B overlay preserved its own local edit
    path: automodpack/client/overlays/packbbb/config/pack-shared-editable.txt
    content: "pack-b-local\n"
  - do: assert_file_content
    name: verify Pack A projection contains its server default beneath the overlay
    path: "${active_dir}/config/pack-shared-editable.txt"
    content: "pack-a-default\n"
  - do: assert
    name: verify Pack B payload is gone after returning to Pack A
    that: { file_gone: "${active_dir}/config/pack-b.txt" }

  # Publish a newer record for the same Pack B identity without the conflicting
  # mod. Its old quarantine is now safe to restore because the active target no
  # longer owns the source path.
  - do: stage_modpack
    name: stage Pack B v2 without the conflicting mod
    recordOnly: true
    packId: packbbb
    packName: Pack B
    patchNotes: "Pack B v2 removes the incompatible mod."
    files:
      - { path: config/pack-b.txt, content: "pack-b-v2\n" }
      - { path: config/pack-shared-editable.txt, content: "pack-b-v2-default\n", editable: true }
  - do: disconnect
    name: leave Pack A before the safe quarantine restore switch
  - use: open_multiplayer
  - use: open_pack_manager
  - do: click
    name: open the newest Pack B record
    select: { text: Pack B }
  - do: click
    name: review the Pack A to Pack B v2 switch
    select: { text: Review pack switch }
  - do: wait_for
    name: show Pack B v2 switch preview
    until: { element: { text: Update, enabled: true } }
  - do: click
    name: accept the Pack B v2 switch
    select: { text: Update }
  - do: wait_for
    name: wait for Pack B v2 restart
    until: { screen: RestartScreen }
  - do: click
    name: restart into Pack B v2
    select: { role: button, index: 1 }
  - do: wait_client_exit
    name: wait for Pack B v2 restart
  - do: launch_client
    name: relaunch Pack B v2 without reconnecting to the Pack A server
  - do: wait_bridge
    name: wait for the offline Pack B v2 bridge
  - use: open_multiplayer
  - do: click
    name: open Pack B v2 settings directly from multiplayer
    select: { text: Modpack settings }
  - do: wait_for
    name: show Pack B quarantine action
    until:
      all:
        - screen: ModpackSelectionScreen
        - element: { text: Quarantine, enabled: true }
  - do: screenshot
    name: capture Pack B quarantine action
    file: all-quarantine-settings
  - do: click
    name: open the quarantine archive
    select: { text: Quarantine }
  - do: wait_for
    name: show the safe quarantine restore action
    until:
      all:
        - screen: QuarantineArchiveScreen
        - element: { text: Restore, enabled: true }
  - do: screenshot
    name: capture the quarantine restore screen
    file: all-quarantine-restore
  - do: click
    name: restore the no-longer-owned local conflict
    select: { text: Restore }
  - do: wait_file
    name: wait for the restored local mod
    path: mods/amp-autotest-conflict.jar
  - do: assert_mod_fixture
    name: verify quarantine restore returned the original local mod
    path: mods/amp-autotest-conflict.jar
    fixture: { modId: amp_autotest_conflict, version: "1.0.0-local", marker: local }
  - do: assert
    name: verify the restored quarantine record was consumed
    that: { file_gone: automodpack/client/quarantine/packbbb/conflicts/fake-conflict/payload }
  - do: click
    name: return from quarantine to Pack B settings
    select: { text: Back }
  - do: wait_for
    name: return to Pack B settings after restore
    until: { screen: ModpackSelectionScreen }
  - do: click
    name: return to the installed pack manager
    select: { text: Pack manager }
  - do: click
    name: open client local storage maintenance
    select: { text: Local storage }
  - do: wait_for
    name: wait for client local storage maintenance
    timeout: 120s
    until:
      all:
        - screen: ClientStorageMaintenanceScreen
        # Before cleanup, the primary action is the enabled cleanup command.
        - element: { text: Clean local storage, enabled: true }
  - do: screenshot
    name: capture client local storage before cleanup
    file: all-local-storage-before
  - do: click
    name: clean stale client local storage
    select: { text: Clean local storage }
  - do: wait_for
    name: wait for client local storage cleanup to complete
    timeout: 120s
    until:
      all:
        - screen: ClientStorageMaintenanceScreen
        - element: { text: Cleanup complete, enabled: false }
  - do: assert_file_content
    name: verify cleanup kept the active Pack B v2 projection
    path: "${active_dir}/config/pack-b.txt"
    content: "pack-b-v2\n"
  - do: assert_mod_fixture
    name: verify cleanup kept the restored local quarantine payload
    path: mods/amp-autotest-conflict.jar
    fixture: { modId: amp_autotest_conflict, version: "1.0.0-local", marker: local }
  - do: assert
    name: verify cleanup kept the consumed quarantine archive empty
    that: { file_gone: automodpack/client/quarantine/packbbb/conflicts/fake-conflict/payload }
  - do: screenshot
    name: capture client local storage after cleanup
    file: all-local-storage-after
  - do: click
    name: leave client local storage maintenance
    select: { text: Back }
  - do: wait_for
    name: return to installed pack manager after cleanup
    until:
      all:
        - screen: InstalledModpacksScreen
        - element: { text: Pack A }
  - do: click
    name: open Pack A before the published update flow
    select: { text: Pack A }
  - do: click
    name: review the Pack B v2 to Pack A switch
    select: { text: Review pack switch }
  - do: wait_for
    name: show the return to Pack A preview
    until: { element: { text: Update, enabled: true } }
  - do: click
    name: accept the return to Pack A
    select: { text: Update }
  - do: wait_for
    name: wait for return to Pack A restart
    until: { screen: RestartScreen }
  - do: click
    name: restart into Pack A before the generation update
    select: { role: button, index: 1 }
  - do: wait_client_exit
    name: wait for return to Pack A restart
  - use: rejoin
  - do: assert_mod_fixture
    name: verify the restored local mod remains unowned after switching back
    path: mods/amp-autotest-conflict.jar
    fixture: { modId: amp_autotest_conflict, version: "1.0.0-local", marker: local }

  - do: publish_server_generation
    name: publish changed and removed files with new patch notes
    generation: 1
  - do: disconnect
    name: leave the game for the published update
  - do: connect
    name: connect to the published generation
  - do: wait_for
    name: show changed and removed generation review
    timeout: 90s
    until:
      all:
        - screen: UpdatePreviewScreen
        - element: { text: Update, enabled: true }
        - element: { text: View all patch notes, enabled: true }
  - do: screenshot
    name: capture changed and removed generation review
    file: all-generation-update
  - do: click
    name: open latest update patch-note history
    select: { text: View all patch notes }
  - do: wait_for
    name: show latest and previous patch notes
    until: { screen: PatchNotesHistoryScreen }
  - do: screenshot
    name: capture latest and previous patch notes
    file: all-generation-patch-history
  - do: click
    name: return to changed and removed review
    select: { text: Back }
  - do: click
    name: accept changed and removed generation
    select: { text: Update }
  - do: wait_file_content
    name: wait for the changed file
    path: "${active_dir}/config/amp-autotest-alpha.txt"
    content: "amp-autotest-alpha-v2\n"
    timeout: 300s
  - do: assert_file_content
    name: verify changed file contents
    path: "${active_dir}/config/amp-autotest-alpha.txt"
    content: "amp-autotest-alpha-v2\n"
  - do: assert_file_content
    name: verify the new file contents
    path: "${active_dir}/config/amp-autotest-delta.txt"
    content: "delta-v2\n"
  - do: assert
    name: verify removed file is gone
    that: { file_gone: "${active_dir}/config/amp-autotest-gamma.cfg" }
  - do: wait_generation
    name: wait for the committed changed generation
    patchNotes: "Update 2: changed alpha, added delta, and removed gamma."
    timeout: 300s
  - do: assert_generation
    name: verify the published generation and latest patch notes
    patchNotes: "Update 2: changed alpha, added delta, and removed gamma."
  - do: compact_server_history
    name: compact server history and verify retained patch notes and deleted metadata
    timeout: 180s
  - do: wait_for
    name: wait for changed generation restart
    until: { screen: RestartScreen }
  - do: click
    name: open changed generation changelog
    select: { text: view changelogs }
  - do: wait_for
    name: show changed generation history
    until: { screen: ChangelogScreen }
  - do: screenshot
    name: capture changed generation changelog
    file: all-generation-changelog
  - do: click
    name: return from changed generation changelog
    select: { text: back }
  - do: click
    name: restart after changed generation
    select: { role: button, index: 1 }
  - do: wait_client_exit
    name: wait for final restart
  - use: rejoin
  - do: quit
    name: stop the installed client before fresh-client reset
  - do: wait_client_exit
    name: wait for the installed client to stop before fresh-client reset
  - do: reset_client_generation
    name: reset only fresh-client generation state and CAS
  - do: assert_client_objects_absent
    name: verify fresh-client CAS is absent before saved-secret preload
  - do: seed_mod_fixture
    name: place the old published mod in a fresh ordinary mods directory
    path: mods/amp-autotest-removed.jar
    fixture: { modId: amp_autotest_removed, version: "1.0.0-published", marker: published }
  - do: seed_bootstrap
    name: re-bootstrap the fresh client from the live server generation
  - do: write_file
    name: opt the fresh client into client-owned preload application
    path: automodpack/client-config.json
    content: |
      {
        "DO_NOT_CHANGE_IT": 3,
        "selectedModpackId": "${bootstrap_modpack_id}",
        "updateSelectedModpackOnLaunch": true,
        "reviewUpdates": false
      }
  - do: launch_client
    name: launch the fresh client without generation history or CAS
  - do: wait_bridge
    name: wait for the fresh client bridge
  - do: assert_preload_acquired
    name: verify the fresh client reacquired current objects into empty CAS
  - do: wait_for
    name: verify preload applied through the normal transaction path
    until:
      log:
        container: client
        matches: 'Preload applied the selected target transaction successfully'
  - do: wait_generation
    name: verify preload committed the advertised generation metadata
    patchNotes: "Update 2: changed alpha, added delta, and removed gamma."
    timeout: 300s
  - do: assert_generation
    name: verify preload committed the generation record and patch notes
    patchNotes: "Update 2: changed alpha, added delta, and removed gamma."
  - do: assert_file_content
    name: verify preload committed current files before any normal download
    path: "${active_dir}/config/amp-autotest-alpha.txt"
    content: "amp-autotest-alpha-v2\n"
  - do: assert
    name: verify preload applied the published tombstone before any normal download
    that: { file_gone: mods/amp-autotest-removed.jar }
  - do: assert_mod_fixture
    name: verify fresh-client current local content remains intact
    path: mods/local-unowned.jar
    fixture: { modId: amp_autotest_unowned, version: "1.0.0-local-unowned", marker: unowned-local }
  - do: disconnect
    name: return from the server to the vanilla title screen before removal
  - use: open_multiplayer
  - do: click
    name: open modpack settings for the installed Pack A
    select: { text: Modpack settings }
  - do: wait_for
    name: show active Pack A management actions
    until:
      all:
        - screen: ModpackSelectionScreen
        - element: { text: Remove, enabled: true }
  - do: screenshot
    name: capture active Pack A removal settings
    file: all-removal-settings
  - do: click
    name: open the Pack A removal review
    select: { text: Remove }
  - do: wait_for
    name: show Pack A removal review
    until:
      all:
        - screen: UpdatePreviewScreen
        - element: { text: Remove, enabled: true }
  - do: screenshot
    name: capture Pack A removal review
    file: all-removal-review
  - do: click
    name: accept Pack A removal
    select: { text: Remove }
  - do: wait_for
    name: return to title after Pack A removal
    until:
      all:
        - screen: Title Screen
        - element: { role: button, text: Singleplayer, enabled: true, visible: true }
        - element: { role: button, text: Multiplayer, enabled: true, visible: true }
  - do: assert
    name: verify Pack A active state was removed
    that: { file_gone: automodpack/client/active-state.json }
  - do: assert
    name: verify Pack A owned projection content was removed
    that: { file_gone: "${active_dir}/config/amp-autotest-alpha.txt" }
  - do: assert
    name: verify Pack A editable overlay was removed
    that: { file_gone: "automodpack/client/overlays/${bootstrap_modpack_id}/config/pack-shared-editable.txt" }
  - do: assert_mod_fixture
    name: verify Pack A removal preserved the unowned local mod
    path: mods/local-unowned.jar
    fixture: { modId: amp_autotest_unowned, version: "1.0.0-local-unowned", marker: unowned-local }
  - do: quit
    name: quit the release-gate client

topology:
  server:
    memory: 2G
    env:
      ENABLE_ROLLING_LOGS: "false"
    automodpack:
      config:
        # A fresh bootstrap file has no per-client login secret. Secure mode must
        # reject its anonymous preload and let authenticated login issue the first
        # usable secret before the modpack download.
        validateSecrets: true
        groups:
          main:
            displayName: Core
            description: Required core files
            required: true
            defaultSelected: true
            allowEditsInFiles: ["/config/pack-shared-editable.txt"]
            syncedFiles: ["/config/amp-autotest-alpha.txt", "/config/amp-autotest-beta.json", "/config/amp-autotest-gamma.cfg", "/config/amp-autotest-baseline.json", "/config/amp-autotest-delta.txt", "/config/amp-autotest-marker.json", "/config/pack-a-only.txt", "/config/pack-shared-editable.txt", "/mods/amp-autotest-removed.jar"]
          visual:
            displayName: Visuals
            description: Default client visuals
            tag: client
            defaultSelected: true
            requires: [main]
            syncedFiles: ["/config/amp-autotest-visual.txt"]
          addon:
            displayName: Addon
            description: Optional addon depending on visuals
            tag: extras
            requires: [visual]
            syncedFiles: ["/config/amp-autotest-addon.txt"]
          alternative:
            displayName: Alternative
            description: Mutually exclusive alternative
            tag: extras
            breaksWith: [visual]
            syncedFiles: ["/config/amp-autotest-alternative.txt"]
          windows:
            displayName: Windows-only
            description: Platform-filtered fixture
            tag: platform
            compatiblePlatforms: [windows]
            syncedFiles: ["/config/amp-autotest-windows.txt"]

serverFiles:
  modpackName: Pack A
