    - { path: config/pack-shared-editable.txt, content: "pack-a-default\n" }
  generations:
    - patchNotes: "Initial release: core content and optional client groups."
      files:
        - { group: main, path: config/amp-autotest-alpha.txt, content: "amp-autotest-alpha\n" }
        - { group: main, path: config/amp-autotest-beta.json, content: '{"id":"beta","value":42}' }
        - { group: main, path: config/amp-autotest-gamma.cfg, content: "alpha=true\nbeta=false\n" }
        - { group: main, path: config/amp-autotest-baseline.json, content: "server-baseline-v1\n" }
        - { group: main, path: mods/amp-autotest-removed.jar, fixture: { modId: amp_autotest_removed, version: "1.0.0-published", marker: published } }
        - { group: visual, path: config/amp-autotest-visual.txt, content: "visual-v1\n" }
        - { group: addon, path: config/amp-autotest-addon.txt, content: "addon-v1\n" }
        - { group: alternative, path: config/amp-autotest-alternative.txt, content: "alternative-v1\n" }
        - { group: windows, path: config/amp-autotest-windows.txt, content: "windows-v1\n" }
        - { group: main, path: config/pack-a-only.txt, content: "pack-a\n" }
        - { group: main, path: config/pack-shared-editable.txt, content: "pack-a-default\n" }
    - patchNotes: "Update 2: changed alpha, added delta, and removed gamma."
