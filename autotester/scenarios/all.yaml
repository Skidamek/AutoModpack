id: all
description: |
  The release gate: exercise secure bootstrap authentication, advanced group
  review, patch-note history, cached pack switching, and a published
  changed/removed generation, server rollback, history compaction, and server
  object collection in one flow. The focused scenarios remain
  available for faster diagnosis; this is the default confidence path.
renderClient: true

# Run the complete release gate independently through each supported opening.
# DIRECT uses a dedicated listener while MAGIC shares the Minecraft
# listener and HOLEPUNCH takes over the marked Login stream.
connectionPaths:
  - mode: DIRECT
    bindPort: 25566
    endpointPort: 25566
  - mode: MAGIC
    bindPort: -1
    endpointPort: 25565
  - mode: HOLEPUNCH
    bindPort: -1
    endpointPort: 25565

releaseGate:
  covers:
    - bootstrap
    - groups
    - patch-notes
    - multiplayer-settings
    - pack-switching
    - generation-update
    - conflict-preservation
    - preservation-vault
    - storage-maintenance
    - server-history-compaction
    - server-generation-rollback
    - server-object-gc
    - fresh-generation-deletion
    - removal
    - secure-bootstrap
    - offline-repair
    - repair-cas-integrity
    - first-install-cleanup-consent
    - repair-ui-navigation
    - storage-verification

flow:
  - use: boot_with_bootstrap
  - do: assert_preload_rejected
    name: verify anonymous bootstrap preload cannot bypass secure authentication
  - do: wait_for
    name: verify bootstrap seeded trust without a TOFU prompt
    timeout: 90s
    until:
      all:
        - log:
            container: client
            matches: 'Imported seeded certificate pin for origin'
            not_matches: 'Received untrusted certificate|Asking user to verify certificate'
  - do: write_file
    name: seed an ordinary local baseline before the first server-owned install
    path: config/amp-autotest-baseline.json
    content: "local-baseline\n"
  - use: connect_to_server
  - do: wait_for
    name: show the first connection review
    timeout: 90s
    until:
      all:
        - screen: UnverifiedPackConfirmScreen
        - no_element: { text: verify }
  - do: click
    name: open advanced group selection
    select: { text: Customize }
  - do: wait_for
    name: show the group-selection list without pagination
    until:
      all:
        - screen: ModpackSelectionScreen
        - element: { text: Core }
        - element: { text: Visuals }
        - element: { text: "Category: Visuals" }
        - element: { text: Windows-only }
        - no_element: { text: "Next >" }
  - do: screenshot
    name: capture the group-selection list at the supported 320x240 logical size
    file: all-groups-page-one
  - do: click
    name: select the visual category unless its defaults already carry it
    select: { text: "[ ] Category: Visuals" }
    when: { element: { text: "[ ] Category: Visuals" } }
  - do: click
    name: select a group with a dependency
    select: { text: Addon }
  - do: wait_for
    name: show the dependency explanation
    until: { element: { text: "[+] Visuals" } }
  - do: click
    name: select the conflicting alternative
    select: { text: Alternative }
  - do: wait_for
    name: show the conflict explanation
    until:
      all:
        - screen: FeatureConflictScreen
        - element: { text: "Use Alternative", enabled: true }
  - do: screenshot
    name: capture deterministic conflict replacement
    file: all-feature-conflict
  - do: click
    name: keep the alternative and replace the conflicting visual choice
    select: { text: "Use Alternative" }
  - do: wait_for
    name: show the unavailable platform group
    until:
      all:
        - element: { text: "[-] Windows-only", enabled: false }
  - do: screenshot
    name: capture unavailable and conflict group states
    file: all-groups-platform
  - do: click
    name: restore default group selection
    select: { text: Defaults }
  - do: click
    name: preview the default target
    select: { text: continue }
  - do: wait_for
    name: show the first unverified write confirm
    timeout: 90s
    until:
      all:
        - screen: UnverifiedPackConfirmScreen
        - element: { text: View all patch notes, enabled: true }
  - do: wait_for
    name: wait for the unverified ack checkbox after the lock
    timeout: 20s
    until:
      element: { key: automodpack.confirm.ack, enabled: true }
  - do: click
    name: acknowledge unverified risk before update
    select: { key: automodpack.confirm.ack }
  - do: wait_for
    name: unlock update after acknowledgement
    timeout: 20s
    until:
      element: { text: Download, enabled: true }
  - do: screenshot
    name: capture first review with latest patch notes
    file: all-first-review
  - do: click
    name: open connected generation patch-note history from review
    select: { text: View all patch notes }
  - do: wait_for
    name: show patch-note history from review
    until: { screen: PatchNotesHistoryScreen }
  - do: screenshot
    name: capture connected patch-note history
    file: all-first-patch-history
  - do: click
    name: return to first review
    select: { text: Back }
  - do: click
    name: accept the complete bootstrap
    select: { text: Download }
  - do: wait_file
    name: wait for the projected modpack marker
    path: "${active_dir}/${marker}"
    timeout: 300s
  - do: wait_generation
    name: wait for the committed bootstrapped generation
    patchNotes: "Initial release: core content and optional client groups."
    timeout: 300s
  - do: assert_authenticated_secret
    name: verify authenticated login persisted the server-issued secret
  - do: assert_generation
    name: verify advanced group metadata and latest notes were installed
    groups:
      main: { required: true, defaultSelected: true }
      visual: { required: false, defaultSelected: true, category: visuals, requires: [main] }
      addon: { required: false, defaultSelected: false, category: extras, requires: [visual] }
      alternative: { required: false, defaultSelected: false, category: extras, breaksWith: [visual] }
      windows: { required: false, compatiblePlatforms: [windows], category: platform }
    patchNotes: "Initial release: core content and optional client groups."
  - do: wait_for
    name: wait for restart review
    until: { screen: RestartScreen }
  - do: screenshot
    name: capture completed bootstrap summary
    file: all-bootstrap-complete
  - do: click
    name: open connected changelog
    select: { text: view changelogs }
  - do: wait_for
    name: show connected generation history
    until: { screen: ChangelogScreen }
  - do: screenshot
    name: capture connected generation history
    file: all-connected-history
  - do: click
    name: open all connected patch notes
    select: { text: View all patch notes }
  - do: wait_for
    name: show all connected patch notes
    until: { screen: PatchNotesHistoryScreen }
  - do: screenshot
    name: capture all connected patch notes
    file: all-connected-patch-history
  - do: click
    name: return to connected changelog
    select: { text: Back }
  - do: click
    name: return to completed update
    select: { text: Back }
  - do: click
    name: restart after bootstrap
    select: { text: "Yes, close the game" }
  - do: wait_client_exit
    name: wait for bootstrap restart
  - use: rejoin
  - do: disconnect
    name: return to the vanilla title screen before opening multiplayer
  # A second complete record is cached while A is active. Stage it before the
  # manager is constructed so the screen reads a complete, stable snapshot.
  - do: stage_modpack
    name: stage a second complete cached pack record
    recordOnly: true
    packId: packbbb
    packName: Pack B
    patchNotes: "Cached Pack B fixture."
    files:
      - { path: config/pack-b.txt, content: "pack-b\n" }
      - { path: config/pack-shared-editable.txt, content: "pack-b-default\n", editable: true }
      # This is a real metadata-only archive with the same mod ID as the local
      # seed below. It carries Fabric, Forge, and NeoForge metadata so the
      # FileInspection planner recognizes it on every supported loader.
      - path: mods/amp-autotest-conflict.jar
        fixture: { modId: amp_autotest_conflict, version: "2.0.0-server", marker: server }
  - use: open_multiplayer
  - use: open_pack_manager
  - do: seed_unowned_local_file
    name: seed an unowned local file for preservation coverage
    path: mods/local-unowned.jar
    fixture: { modId: amp_autotest_unowned, version: "1.0.0-local-unowned", marker: unowned-local }
  - do: seed_same_path_conflict
    name: seed the local payload at the server-owned mods path
    path: mods/amp-autotest-conflict.jar
    fixture: { modId: amp_autotest_conflict, version: "1.0.0-local", marker: local }
  - do: write_file
    name: make a Pack A local edit to the shared editable config
    path: config/pack-shared-editable.txt
    content: "pack-a-local\n"
  - do: assert_file_content
    name: verify the Pack A local edit is live before switching
    path: config/pack-shared-editable.txt
    content: "pack-a-local\n"
  - do: assert_file_content
    name: verify Pack A projection still contains its server default
    path: "${active_dir}/config/pack-shared-editable.txt"
    content: "pack-a-default\n"
  - do: disconnect
    name: leave the active pack without changing it
  - use: open_multiplayer
  - use: open_pack_manager
  - do: wait_for
    name: show both installed packs without activating the row
    until:
      all:
        - element: { text: Pack A }
        - element: { text: Pack B }
        - element: { text: server }
  - do: click
    name: open Pack B for review only
    select: { text: Pack B }
  - do: wait_for
    name: show Pack B lifecycle actions
    until:
      all:
        - screen: ModpackDetailsScreen
        - element: { text: Activate, enabled: true }
  - do: click
    name: review the A to B cached switch
    select: { text: Activate }
  - do: wait_for
    name: show the A to B unverified switch confirm
    timeout: 90s
    until:
      all:
        - screen: UnverifiedPackConfirmScreen
        - element: { key: automodpack.confirm.ack, enabled: true }
  - do: screenshot
    name: capture A to B switch review
    file: all-switch-a-to-b
  - do: click
    name: acknowledge unverified risk for the A to B switch
    select: { key: automodpack.confirm.ack }
  - do: wait_for
    name: unlock the A to B switch after acknowledgement
    timeout: 20s
    until:
      element: { key: automodpack.update.apply, enabled: true }
  - do: click
    name: accept the A to B switch
    select: { key: automodpack.update.apply }
  - do: wait_for
    name: wait for A to B restart
    until: { screen: RestartScreen }
  - do: click
    name: restart into Pack B
    select: { text: "Yes, close the game" }
  - do: wait_client_exit
    name: wait for Pack B restart
  - do: launch_client
    name: relaunch after Pack B switch
  - do: wait_bridge
    name: wait for Pack B bridge
  - do: assert_mod_fixture
    name: verify the unowned local mod survived A to B
    path: mods/local-unowned.jar
    fixture: { modId: amp_autotest_unowned, version: "1.0.0-local-unowned", marker: unowned-local }
  - do: assert_file_content
    name: verify Pack B payload is active after accepting the switch
    path: "${active_dir}/config/pack-b.txt"
    content: "pack-b\n"
  - do: assert_mod_fixture
    name: verify the server-owned valid mod is active for Pack B
    path: "${active_dir}/mods/amp-autotest-conflict.jar"
    fixture: { modId: amp_autotest_conflict, version: "2.0.0-server", marker: server }
  - do: assert_preservation_claim
    name: verify the local collision payload was preserved in preservation
    packId: packbbb
    fixture: { modId: amp_autotest_conflict, version: "1.0.0-local", marker: local }
  - do: assert
    name: verify the local same-ID source was moved out of mods
    that: { file_gone: mods/amp-autotest-conflict.jar }
  - do: assert
    name: verify Pack A only payload is gone while Pack B is active
    that: { file_gone: "${active_dir}/config/pack-a-only.txt" }
  - use: open_multiplayer
  - use: open_pack_manager
  - do: click
    name: open inactive Pack A to verify repair availability
    select: { text: Pack A }
  - do: wait_for
    name: keep repair unavailable for an inactive pack
    until:
      all:
        - screen: ModpackDetailsScreen
        - no_element: { text: Repair }
  - do: click
    name: return from inactive Pack A details
    select: { text: Back }
  - do: click
    name: open active Pack B repair actions
    select: { text: Pack B }
  - do: wait_for
    name: expose repair only for the active pack
    until:
      all:
        - screen: ModpackDetailsScreen
        - element: { text: Repair, enabled: true }
  - do: click
    name: open a healthy repair review
    select: { text: Repair }
  - do: wait_for
    name: keep unowned mods by default during repair
    timeout: 120s
    until:
      all:
        - screen: OfflineRepairScreen
        - element: { text: "[ ] Keep 1 extra mod files", enabled: true }
  - do: click
    name: cancel the healthy repair review
    select: { text: Back }
  - do: wait_for
    name: return from repair without leaving Pack B details stale
    until:
      all:
        - screen: ModpackDetailsScreen
        - element: { text: Repair, enabled: true }
  - do: click
    name: return to the installed pack list before preserved files
    select: { text: Back }
  - do: wait_for
    name: show preserved files on the installed pack list
    until:
      all:
        - screen: InstalledModpacksScreen
        - element: { text: Preserved files }
  - do: click
    name: open the owned conflict in preserved files from the pack list
    select: { text: Preserved files }
  - do: click
    name: select the still-owned local conflict
    select: { text: amp-autotest-conflict.jar }
  - do: click
    name: attempt an unsafe restore without overwriting the active pack
    select: { text: Restore }
  - do: wait_for
    name: show the unsafe restore as a recoverable error
    timeout: 30s
    until: { screen: ErrorScreen }
  - do: click
    name: copy the unsafe restore diagnostics
    select: { text: Copy details }
  - do: click
    name: return to the same preservation selection
    select: { text: Back }
  - do: wait_for
    name: keep the owned conflict in preserved files after the unsafe restore
    until:
      all:
        - screen: PreservationVaultScreen
        - element: { text: amp-autotest-conflict.jar, enabled: true }
        - element: { text: Save copy, enabled: true }
  - do: click
    name: leave the preservation vault
    select: { text: Back }
  - do: wait_for
    name: return to the installed pack list from the vault
    until: { screen: InstalledModpacksScreen }
  - do: click
    name: leave the installed pack manager
    select: { text: Back }
  - do: wait_for
    name: return to multiplayer after repair navigation
    until: { screen: Play Multiplayer }
  - do: disconnect
    name: reset to the title screen after the repair navigation cycle
  - do: write_file
    name: make a Pack B local edit to the shared editable config
    path: config/pack-shared-editable.txt
    content: "pack-b-local\n"
  - do: assert_file_content
    name: verify the Pack B local edit is live before switching back
    path: config/pack-shared-editable.txt
    content: "pack-b-local\n"
  - do: assert_file_content
    name: verify Pack B projection still contains its server default
    path: "${active_dir}/config/pack-shared-editable.txt"
    content: "pack-b-default\n"
  - use: open_multiplayer
  - use: open_pack_manager
  - do: click
    name: open Pack A for the reverse switch
    select: { text: Pack A }
  - do: wait_for
    name: show Pack A lifecycle actions
    until:
      all:
        - screen: ModpackDetailsScreen
        - element: { text: Activate, enabled: true }
  - do: click
    name: review the B to A cached switch
    select: { text: Activate }
  - do: wait_for
    name: show the B to A unverified switch confirm
    timeout: 90s
    until:
      all:
        - screen: UnverifiedPackConfirmScreen
        - element: { key: automodpack.confirm.ack, enabled: true }
  - do: screenshot
    name: capture B to A switch review
    file: all-switch-b-to-a
  - do: click
    name: acknowledge unverified risk for the B to A switch
    select: { key: automodpack.confirm.ack }
  - do: wait_for
    name: unlock the B to A switch after acknowledgement
    timeout: 20s
    until:
      element: { key: automodpack.update.apply, enabled: true }
  - do: click
    name: accept the B to A switch
    select: { key: automodpack.update.apply }
  - do: wait_for
    name: wait for B to A restart
    until: { screen: RestartScreen }
  - do: click
    name: restart into Pack A
    select: { text: "Yes, close the game" }
  - do: wait_client_exit
    name: wait for reverse switch restart
  - use: rejoin
  - do: assert_mod_fixture
    name: verify the unowned local mod survived B to A
    path: mods/local-unowned.jar
    fixture: { modId: amp_autotest_unowned, version: "1.0.0-local-unowned", marker: unowned-local }
  - do: assert_file_content
    name: verify the Pack A only payload is restored after the reverse switch
    path: "${active_dir}/config/pack-a-only.txt"
    content: "pack-a\n"
  - do: assert_file_content
    name: verify switching back restored the Pack A local edit
    path: config/pack-shared-editable.txt
    content: "pack-a-local\n"
  - do: assert_file_content
    name: verify Pack A overlay remains isolated from Pack B
    path: "automodpack/client/overlays/${bootstrap_modpack_id}/config/pack-shared-editable.txt"
    content: "pack-a-local\n"
  - do: assert_file_content
    name: verify Pack B overlay preserved its own local edit
    path: automodpack/client/overlays/packbbb/config/pack-shared-editable.txt
    content: "pack-b-local\n"
  - do: assert_file_content
    name: verify Pack A projection contains its server default beneath the overlay
    path: "${active_dir}/config/pack-shared-editable.txt"
    content: "pack-a-default\n"
  - do: assert
    name: verify Pack B payload is gone after returning to Pack A
    that: { file_gone: "${active_dir}/config/pack-b.txt" }

  # Publish a newer record for the same Pack B identity without the conflicting
  # mod. Its old preservation is now safe to restore because the active target no
  # longer owns the source path.
  - do: stage_modpack
    name: stage Pack B v2 without the conflicting mod
    recordOnly: true
    packId: packbbb
    packName: Pack B
    patchNotes: "Pack B v2 removes the incompatible mod."
    files:
      - { path: config/pack-b.txt, content: "pack-b-v2\n" }
      - { path: config/pack-shared-editable.txt, content: "pack-b-v2-default\n", editable: true }
  - do: disconnect
    name: leave Pack A before the safe preservation restore switch
  - use: open_multiplayer
  - use: open_pack_manager
  - do: click
    name: open the newest Pack B record
    select: { text: Pack B }
  - do: click
    name: review the Pack A to Pack B v2 switch
    select: { text: Activate }
  - do: wait_for
    name: show Pack B v2 switch preview
    until: { element: { text: Update, enabled: true } }
  - do: click
    name: accept the Pack B v2 switch
    select: { text: Update }
  - do: wait_for
    name: wait for Pack B v2 restart
    until: { screen: RestartScreen }
  - do: click
    name: restart into Pack B v2
    select: { text: "Yes, close the game" }
  - do: wait_client_exit
    name: wait for Pack B v2 restart
  - do: launch_client
    name: relaunch Pack B v2 without reconnecting to the Pack A server
  - do: wait_bridge
    name: wait for the offline Pack B v2 bridge
  - use: open_multiplayer
  - do: click
    name: open Pack B v2 settings directly from multiplayer
    select: { text: Modpack settings }
  - do: wait_for
    name: show the installed pack list from multiplayer
    until:
      all:
        - screen: InstalledModpacksScreen
        - element: { text: Pack B, enabled: true }
  - do: click
    name: open Pack B v2 details
    select: { text: Pack B }
  - do: wait_for
    name: show Pack B history action
    until:
      all:
        - screen: ModpackDetailsScreen
        - element: { text: History, enabled: true }
  - do: click
    name: open Pack B generation history from multiplayer settings
    select: { text: History }
  - do: wait_for
    name: show Pack B generation history and attached notes
    until: { screen: ContentHistoryScreen }
  - do: screenshot
    name: capture Pack B generation history
    file: all-content-history
  - do: click
    name: open all Pack B patch notes from content history
    select: { text: Patch notes }
  - do: wait_for
    name: show all Pack B patch notes
    until: { screen: PatchNotesHistoryScreen }
  - do: click
    name: return to Pack B content history
    select: { text: Back }
  - do: wait_for
    name: return to Pack B content history after all notes
    until: { screen: ContentHistoryScreen }
  - do: click
    name: leave Pack B content history
    select: { text: Back }
  - do: wait_for
    name: return to Pack B details after history
    until: { screen: ModpackDetailsScreen }
  - do: click
    name: return to the installed pack list before preserved files restore
    select: { text: Back }
  - do: wait_for
    name: show preserved files on the pack list after history
    until:
      all:
        - screen: InstalledModpacksScreen
        - element: { text: Preserved files }
  - do: screenshot
    name: capture Pack B preservation action
    file: all-preservation-settings
  - do: click
    name: open the preservation archive
    select: { text: Preserved files }
  # The vault lists newest first and the headless window fits one row per page,
  # so the claim usually sits behind the newer pack-b deactivation claim and needs paging;
  # a run that already opens on it skips the page turn.
  - do: click
    name: page past the newer deactivation claim
    select: { key: automodpack.ui.next }
    skip_if: { element: { text: amp-autotest-conflict.jar, enabled: true } }
  - do: wait_for
    name: show the preserved local conflict after paging
    until:
      all:
        - screen: PreservationVaultScreen
        - element: { text: amp-autotest-conflict.jar, enabled: true }
  - do: click
    name: select the preserved local conflict
    select: { text: amp-autotest-conflict.jar }
  - do: wait_for
    name: show the safe preservation restore action
    until:
      all:
        - screen: PreservationVaultScreen
        - element: { text: Restore, enabled: true }
  - do: screenshot
    name: capture the preservation restore screen
    file: all-preservation-restore
  - do: click
    name: restore the no-longer-owned local conflict
    select: { text: Restore }
  - do: wait_for
    name: show the restored path and drop the claim from the list
    until:
      all:
        - screen: PreservationVaultScreen
        - element: { text: Restored to mods/amp-autotest-conflict.jar }
        - no_element: { text: amp-autotest-conflict.jar, enabled: true }
  - do: wait_file
    name: wait for the restored local mod
    path: mods/amp-autotest-conflict.jar
  - do: assert_mod_fixture
    name: verify preservation restore returned the original local mod
    path: mods/amp-autotest-conflict.jar
    fixture: { modId: amp_autotest_conflict, version: "1.0.0-local", marker: local }
  - do: assert_preservation_claim
    name: verify restore released the preservation claim
    packId: packbbb
    fixture: { modId: amp_autotest_conflict, version: "1.0.0-local", marker: local }
    present: false
  - do: click
    name: return from preservation to the installed pack list
    select: { text: Back }
  - do: wait_for
    name: return to the installed pack list after restore
    until:
      all:
        - screen: InstalledModpacksScreen
        - element: { text: Pack A, enabled: true }
  - do: click
    name: open client local storage maintenance
    select: { text: Local storage }
  - do: wait_for
    name: wait for client local storage maintenance
    timeout: 120s
    until:
      all:
        - screen: ClientStorageMaintenanceScreen
        # Before cleanup, the primary action is the enabled cleanup command.
        - element: { text: Clean local storage, enabled: true }
  - do: screenshot
    name: capture client local storage before cleanup
    file: all-local-storage-before
  - do: click
    name: clean stale client local storage
    select: { text: Clean local storage }
  - do: wait_for
    name: wait for client local storage cleanup to complete
    timeout: 120s
    until:
      all:
        - screen: ClientStorageMaintenanceScreen
        # Completion is rendered as status text; the enabled command proves the operation returned to idle.
        - element: { text: Clean local storage, enabled: true }
  - do: assert_file_content
    name: verify cleanup kept the active Pack B v2 projection
    path: "${active_dir}/config/pack-b.txt"
    content: "pack-b-v2\n"
  - do: assert_mod_fixture
    name: verify cleanup kept the restored local preservation payload
    path: mods/amp-autotest-conflict.jar
    fixture: { modId: amp_autotest_conflict, version: "1.0.0-local", marker: local }
  - do: assert_preservation_claim
    name: verify cleanup did not recreate the consumed preservation claim
    packId: packbbb
    fixture: { modId: amp_autotest_conflict, version: "1.0.0-local", marker: local }
    present: false
  - do: screenshot
    name: capture client local storage after cleanup
    file: all-local-storage-after
  - do: click
    name: leave client local storage maintenance
    select: { text: Back }
  - do: wait_for
    name: return to installed pack manager after cleanup
    until:
      all:
        - screen: InstalledModpacksScreen
        - element: { text: Pack A }
  - do: click
    name: open Pack A before the published update flow
    select: { text: Pack A }
  - do: click
    name: review the Pack B v2 to Pack A switch
    select: { text: Activate }
  - do: wait_for
    name: show the return to Pack A unverified switch confirm
    timeout: 90s
    until:
      all:
        - screen: UnverifiedPackConfirmScreen
        - element: { key: automodpack.confirm.ack, enabled: true }
  - do: click
    name: acknowledge unverified risk for the return to Pack A
    select: { key: automodpack.confirm.ack }
  - do: wait_for
    name: unlock the return to Pack A after acknowledgement
    timeout: 20s
    until:
      element: { key: automodpack.update.apply, enabled: true }
  - do: click
    name: accept the return to Pack A
    select: { key: automodpack.update.apply }
  - do: wait_for
    name: wait for return to Pack A restart
    until: { screen: RestartScreen }
  - do: click
    name: restart into Pack A before the generation update
    select: { text: "Yes, close the game" }
  - do: wait_client_exit
    name: wait for return to Pack A restart
  - use: rejoin
  - do: assert_mod_fixture
    name: verify the restored local mod remains unowned after switching back
    path: mods/amp-autotest-conflict.jar
    fixture: { modId: amp_autotest_conflict, version: "1.0.0-local", marker: local }

  - do: publish_server_generation
    name: publish changed and removed files with new patch notes
    generation: 1
  - do: disconnect
    name: leave the game for the published update
  - do: connect
    name: connect to the published generation
  - do: wait_for
    name: show changed and removed generation review
    timeout: 90s
    until:
      all:
        - screen: UpdatePreviewScreen
        - element: { text: Update, enabled: true }
        - element: { text: View all patch notes, enabled: true }
  - do: screenshot
    name: capture changed and removed generation review
    file: all-generation-update
  - do: click
    name: open latest update patch-note history
    select: { text: View all patch notes }
  - do: wait_for
    name: show latest and previous patch notes
    until: { screen: PatchNotesHistoryScreen }
  - do: screenshot
    name: capture latest and previous patch notes
    file: all-generation-patch-history
  - do: click
    name: return to changed and removed review
    select: { text: Back }
  - do: click
    name: accept changed and removed generation
    select: { text: Update }
  - do: wait_file_content
    name: wait for the changed file
    path: "${active_dir}/config/amp-autotest-alpha.txt"
    content: "amp-autotest-alpha-v2\n"
    timeout: 300s
  - do: assert_file_content
    name: verify changed file contents
    path: "${active_dir}/config/amp-autotest-alpha.txt"
    content: "amp-autotest-alpha-v2\n"
  - do: assert_file_content
    name: verify the new file contents
    path: "${active_dir}/config/amp-autotest-delta.txt"
    content: "delta-v2\n"
  - do: assert
    name: verify removed file is gone
    that: { file_gone: "${active_dir}/config/amp-autotest-gamma.cfg" }
  - do: wait_generation
    name: wait for the committed changed generation
    patchNotes: "Update 2: changed alpha, added delta, and removed gamma."
    timeout: 300s
  - do: assert_generation
    name: verify the published generation and latest patch notes
    patchNotes: "Update 2: changed alpha, added delta, and removed gamma."
  - do: wait_for
    name: wait for changed generation restart
    until: { screen: RestartScreen }
  - do: click
    name: open changed generation changelog
    select: { text: view changelogs }
  - do: wait_for
    name: show changed generation history
    until: { screen: ChangelogScreen }
  - do: screenshot
    name: capture changed generation changelog
    file: all-generation-changelog
  - do: click
    name: return from changed generation changelog
    select: { text: back }
  - do: click
    name: restart after changed generation
    select: { text: "Yes, close the game" }
  - do: wait_client_exit
    name: wait for final restart
  - use: rejoin
  - do: disconnect
    name: return to multiplayer before reviewing recovered
  - use: open_multiplayer
  - do: click
    name: open Pack A settings for recovered
    select: { text: Modpack settings }
  - do: wait_for
    name: show the installed pack list for recovered
    until:
      all:
        - screen: InstalledModpacksScreen
        - element: { text: Pack A, enabled: true }
        - element: { text: Preserved files }
  - do: click
    name: open the recovered archive from the pack list
    select: { text: Preserved files }
  - do: wait_for
    name: show the removed file as recoverable
    until:
      all:
        - screen: PreservationVaultScreen
        - element: { text: amp-autotest-gamma.cfg, enabled: true }
  - do: screenshot
    name: capture available recovered files
    file: all-recovered-available
  - do: click
    name: return to the pack list with the removed-file claim still held
    select: { text: Back }
  - do: wait_for
    name: return to the installed pack list before corrupting client storage
    until: { screen: InstalledModpacksScreen }
  - do: mutate_active_object
    name: corrupt a current CAS object behind the active projection
    path: config/amp-autotest-alpha.txt
    action: corrupt
  - do: mutate_client_file
    name: corrupt a live managed file independently of CAS
    path: config/amp-autotest-beta.json
    action: corrupt
  - do: mutate_active_object
    name: remove the only local CAS copy for the unavailable-byte branch
    path: config/amp-autotest-delta.txt
    action: delete
  - do: mutate_client_file
    name: remove the projected copy for the unavailable-byte branch
    path: "${active_dir}/config/amp-autotest-delta.txt"
    action: delete
  - do: mutate_client_file
    name: remove the live copy for the unavailable-byte branch
    path: config/amp-autotest-delta.txt
    action: delete
  - do: click
    name: reopen Pack A details for repair
    select: { text: Pack A }
  - do: wait_for
    name: expose active-pack repair beside update
    until:
      all:
        - screen: ModpackDetailsScreen
        - element: { text: Repair, enabled: true }
  - do: click
    name: inspect deliberate corruption without trusting caches
    select: { text: Repair }
  - do: wait_for
    name: show repairable and unavailable findings with safe defaults
    timeout: 120s
    until:
      all:
        - screen: OfflineRepairScreen
        - element: { text: "[ ] Keep changes in config/pack-shared-editable.txt", enabled: true }
        - element: { text: "[ ] Keep 2 extra mod files", enabled: true }
        - element: { text: Repair, enabled: true }
        - element: { text: Update and finish repair, enabled: true }
  - do: screenshot
    name: capture offline repair findings and defaults
    file: all-offline-repair-findings
  - do: wait_for
    name: show the editable row checked as reset consent by default
    until:
      all:
        - element: { text: "[ ] Keep changes in config/pack-shared-editable.txt", enabled: true }
        - element: { text: "[ ] Keep 2 extra mod files", enabled: true }
        - element: { text: Keep all editable changes, enabled: true }
  - do: click
    name: opt into keeping the edited file
    select: { text: "[ ] Keep changes in config/pack-shared-editable.txt" }
  - do: wait_for
    name: show the keep choice checked on the editable row
    until: { element: { text: "[x] Keep changes in config/pack-shared-editable.txt", enabled: true } }
  - do: click
    name: return the editable row to removal consent before leaving
    select: { text: "[x] Keep changes in config/pack-shared-editable.txt" }
  - do: wait_for
    name: restore the unchecked reset consent on the editable row
    until: { element: { text: "[ ] Keep changes in config/pack-shared-editable.txt", enabled: true } }
  - do: click
    name: opt into keeping the unowned mods
    select: { text: "[ ] Keep 2 extra mod files" }
  - do: wait_for
    name: show the keep choice checked on the unowned row
    until: { element: { text: "[x] Keep 2 extra mod files", enabled: true } }
  - do: click
    name: return to removal consent before leaving
    select: { text: "[x] Keep 2 extra mod files" }
  - do: click
    name: cancel repair after exercising every choice
    select: { text: Back }
  - do: wait_for
    name: return to usable Pack A details after repair cancellation
    until:
      all:
        - screen: ModpackDetailsScreen
        - element: { text: Repair, enabled: true }
  - do: click
    name: reopen repair to verify choices did not leak
    select: { text: Repair }
  - do: wait_for
    name: restore reset-consent and keep-unowned defaults on reopen
    timeout: 120s
    until:
      all:
        - element: { text: "[ ] Keep changes in config/pack-shared-editable.txt", enabled: true }
        - element: { text: "[ ] Keep 2 extra mod files", enabled: true }
  - do: wait_for
    name: hold both rows at removal consent while keeping is one click away
    until:
      all:
        - element: { text: "[ ] Keep changes in config/pack-shared-editable.txt", enabled: true }
        - element: { text: "[ ] Keep 2 extra mod files", enabled: true }
        - element: { text: Repair, enabled: true }
  - do: click
    name: repair every locally available byte before updating
    select: { text: Repair }
  - do: wait_for
    name: retain only unavailable findings after local repair
    timeout: 120s
    until:
      all:
        - screen: OfflineRepairScreen
        - element: { text: Update and finish repair, enabled: true }
        - element: { text: Repair, enabled: false }
  - do: assert_client_object
    name: verify repair rebuilt the corrupt active CAS object
    path: config/amp-autotest-alpha.txt
  - do: assert_file_content
    name: verify repair restored the corrupt live file
    path: config/amp-autotest-beta.json
    content: '{"id":"beta","value":43}'
  - do: assert_file_content
    name: verify selected editable reset restored the server default
    path: config/pack-shared-editable.txt
    content: "pack-a-default\n"
  - do: assert
    name: verify repair removed the first unowned mod only after consent
    that: { file_gone: mods/local-unowned.jar }
  - do: assert
    name: verify repair removed the restored conflict only after consent
    that: { file_gone: mods/amp-autotest-conflict.jar }
  - do: assert_preservation_claim
    name: verify editable reset preserved the player copy
    packId: "${bootstrap_modpack_id}"
    originalPath: config/pack-shared-editable.txt
    reason: EDITABLE_RESET
  - do: assert_preservation_claim
    name: verify repair cleanup preserved both unowned mods
    packId: "${bootstrap_modpack_id}"
    reason: STRICT_REPAIR
    count: 2
  - do: click
    name: use update to fetch the bytes unavailable to offline repair
    select: { text: Update and finish repair }
  - do: wait_for
    name: review the same-generation repair download
    timeout: 120s
    until:
      all:
        - screen: UpdatePreviewScreen
        - element: { text: Update, enabled: true }
  - do: click
    name: approve the download that finishes repair
    select: { text: Update }
  - do: wait_file_content
    name: verify update restored the unavailable file
    path: "${active_dir}/config/amp-autotest-delta.txt"
    content: "delta-v2\n"
    timeout: 300s
  - do: assert_client_object
    name: verify update restored the unavailable CAS object
    path: config/amp-autotest-delta.txt
  - do: disconnect
    name: reset to title before the post-repair verification cycle
  - use: open_multiplayer
  - use: open_pack_manager
  - do: mutate_preservation_object
    name: corrupt the archived unowned mod's CAS object while its claim remains
    packId: "${bootstrap_modpack_id}"
    originalPath: mods/local-unowned.jar
    action: corrupt
  - do: click
    name: open client storage verification with corrupt required preservation bytes
    select: { text: Local storage }
  - do: click
    name: report corrupt required preservation bytes
    select: { text: Verify storage }
  - do: wait_for
    name: show the corrupt preserved bytes as a verification error
    timeout: 120s
    until: { screen: ErrorScreen }
  - do: click
    name: return from the preservation verification error to the maintenance screen
    select: { text: Back }
  - do: wait_for
    name: keep maintenance usable after the preservation verification error
    until:
      all:
        - screen: ClientStorageMaintenanceScreen
        - element: { text: Verify storage, enabled: true }
  - do: click
    name: leave the failed preservation verification
    select: { text: Back }
  - do: wait_for
    name: reach the installed pack list before discarding the corrupted claim
    until: { screen: InstalledModpacksScreen }
  - do: click
    name: open the vault to discard the corrupted preserved file
    select: { text: Preserved files }
  # The archived unowned mod was preserved last by the repair, so the vault's newest-first
  # list opens on it even though the headless window fits one row per page.
  - do: wait_for
    name: show the corrupted preserved file first in the vault
    until:
      all:
        - screen: PreservationVaultScreen
        - element: { text: local-unowned.jar, enabled: true }
  - do: click
    name: select the corrupted preserved file
    select: { text: local-unowned.jar }
  - do: click
    name: arm deletion of the corrupted preserved file
    select: { text: Delete }
  - do: click
    name: cancel the deletion by reselecting the file
    select: { text: local-unowned.jar }
  - do: click
    name: arm deletion of the corrupted preserved file again
    select: { text: Delete }
  - do: click
    name: discard the corrupted preserved file on the second click
    select: { text: Delete }
  - do: wait_for
    name: drop the discarded preserved file from the vault
    until:
      all:
        - screen: PreservationVaultScreen
        - no_element: { text: local-unowned.jar, enabled: true }
  - do: assert_preservation_claim
    name: verify the discard released the corrupted preserved claim
    packId: "${bootstrap_modpack_id}"
    originalPath: mods/local-unowned.jar
    present: false
  - do: click
    name: return to the pack list after the discard
    select: { text: Back }
  - do: click
    name: verify repaired client storage
    select: { text: Local storage }
  - do: click
    name: run successful storage verification after repair
    select: { text: Verify storage }
  - do: sleep
    name: allow asynchronous storage verification to leave its running state
    duration: 1s
  - do: wait_for
    name: return to usable storage maintenance after successful verification
    timeout: 120s
    until:
      all:
        - screen: ClientStorageMaintenanceScreen
        - element: { text: Verify storage, enabled: true }
  - do: click
    name: return to the manager after successful verification
    select: { text: Back }
  - do: click
    name: reopen the preservation vault after repair
    select: { text: Preserved files }
  # The vault lists newest first and the discarded unowned-mod claim was newer than the
  # surviving editable-reset claim, so the survivor usually sits one page behind on the
  # short window; a run that already opens on it skips the page turn.
  - do: click
    name: page past the surviving strict-repair claim
    select: { key: automodpack.ui.next }
    skip_if: { element: { text: pack-shared-editable.txt, enabled: true } }
  - do: wait_for
    name: show the surviving editable-reset claim
    timeout: 30s
    until:
      all:
        - screen: PreservationVaultScreen
        - element: { text: pack-shared-editable.txt, enabled: true }
  - do: click
    name: select the editable-reset claim to save a copy
    select: { text: pack-shared-editable.txt }
  - do: click
    name: save a copy of the editable-reset claim
    select: { text: Save copy }
  - do: wait_for
    name: show the saved copy path and drop the editable-reset claim
    until:
      all:
        - screen: PreservationVaultScreen
        - element: { text: Saved a copy to automodpack/recovered/ }
        - no_element: { text: pack-shared-editable.txt, enabled: true }
  - do: assert_preservation_claim
    name: verify save-copy released the editable-reset claim
    packId: "${bootstrap_modpack_id}"
    originalPath: config/pack-shared-editable.txt
    reason: EDITABLE_RESET
    present: false
  - do: click
    name: return to the installed pack manager after deletion
    select: { text: Back }
  - do: click
    name: return to multiplayer after repair and vault review
    select: { text: Back }
  - do: wait_for
    name: verify the installed pack list closes onto multiplayer
    until: { screen: Play Multiplayer }
  - do: quit
    name: stop the installed client before fresh-client reset
  - do: wait_client_exit
    name: wait for the installed client to stop before fresh-client reset
  - do: reset_client_generation
    name: reset fresh-client install state
  - do: reset_isolated_client_objects
    name: reset the isolated test client's CAS
  - do: assert_client_objects_absent
    name: verify fresh-client CAS is absent before saved-secret preload
  - do: seed_mod_fixture
    name: place the old published mod in a fresh ordinary mods directory
    path: mods/amp-autotest-removed.jar
    fixture: { modId: amp_autotest_removed, version: "1.0.0-published", marker: published }
  - do: seed_mod_fixture
    name: place another unowned mod in the fresh ordinary mods directory
    path: mods/local-unowned.jar
    fixture: { modId: amp_local_unowned, version: "9.9.9-local", marker: local-only }
  - do: seed_bootstrap
    name: re-bootstrap the fresh client from the live server generation
  - do: write_file
    name: keep the fresh client on the mandatory review path
    path: automodpack/client-config.json
    content: |
      {
        "DO_NOT_CHANGE_IT": 3,
        "selectedModpackId": "${bootstrap_modpack_id}",
        "updateSelectedModpackOnLaunch": true
      }
  - do: launch_client
    name: launch the fresh client without generation history or CAS
  - do: wait_bridge
    name: wait for the fresh client bridge
  - do: assert_preload_acquired
    name: verify the fresh client reacquired its selected groups into empty CAS
    groups: [main, visual]
  - do: wait_for
    name: verify first install waits for in-game review
    until:
      log:
        file: logs/latest.log
        matches: 'Launch apply is waiting for first-install review'
  - do: assert_mod_fixture
    name: verify preload left the direct mod untouched before review
    path: mods/amp-autotest-removed.jar
    fixture: { modId: amp_autotest_removed, version: "1.0.0-published", marker: published }
  - do: connect
    name: connect the fresh client for the normal review flow
  - do: wait_for
    name: show optional first-install cleanup with a safe default
    timeout: 90s
    until:
      all:
        - screen: [MatchedPackConfirmScreen, UnverifiedPackConfirmScreen]
        - element: { key: automodpack.firstConnect.leftoverArchive, enabled: true }
  - do: screenshot
    name: capture first-install cleanup with its safe default
    file: all-first-install-cleanup-default
  - do: click
    name: navigate into first-install customization before consent
    select: { key: automodpack.confirm.customize }
  - do: wait_for
    name: show first-install group customization
    until: { screen: ModpackSelectionScreen }
  - do: click
    name: return from customization without installing
    select: { text: Back }
  - do: wait_for
    name: return to the same first-install consent state
    until:
      all:
        - screen: [MatchedPackConfirmScreen, UnverifiedPackConfirmScreen]
        - element: { key: automodpack.firstConnect.leftoverArchive, enabled: true }
  - do: click
    name: opt into keeping existing mods
    select: { key: automodpack.firstConnect.leftoverArchive }
  - do: wait_for
    name: show checked keep state after opting in
    until: { element: { key: automodpack.firstConnect.leftoverKeep, enabled: true } }
  - do: screenshot
    name: capture first-install cleanup keep state
    file: all-first-install-cleanup-consent
  - do: click
    name: return to the default removal consent before continuing
    select: { key: automodpack.firstConnect.leftoverKeep }
  - do: wait_for
    name: wait for the unverified ack checkbox or an already trusted download
    timeout: 30s
    until:
      any:
        - element: { key: automodpack.confirm.ack, enabled: true }
        - element: { key: automodpack.firstConnect.download, enabled: true }
  - do: click
    name: acknowledge unverified risk
    select: { key: automodpack.confirm.ack }
    when: { element: { key: automodpack.confirm.ack, enabled: true } }
  - do: wait_for
    name: unlock download after acknowledgement
    timeout: 20s
    until:
      element: { key: automodpack.firstConnect.download, enabled: true }
  - do: click
    name: continue with defaults and approved cleanup
    select: { key: automodpack.firstConnect.download }
  - do: wait_for
    name: review the strict first-install update or restart directly
    timeout: 90s
    until:
      any:
        - screen: RestartScreen
        - all:
            - screen: UpdatePreviewScreen
            - element: { key: automodpack.update.apply, enabled: true }
        - all:
            - screen: UnverifiedPackConfirmScreen
            - element: { key: automodpack.confirm.ack, enabled: true }
  - do: click
    name: acknowledge later unverified risk
    select: { key: automodpack.confirm.ack }
    when: { element: { key: automodpack.confirm.ack, enabled: true } }
  - do: click
    name: approve strict first-install reconciliation
    select: { text: Update }
    when: { element: { key: automodpack.update.apply, enabled: true } }
  - do: wait_file
    name: wait for the fresh strict installation
    path: "${active_dir}/${marker}"
    timeout: 300s
  - use: restart_client
  - use: rejoin
  - do: wait_generation
    name: verify the fresh client committed the advertised generation metadata
    patchNotes: "Update 2: changed alpha, added delta, and removed gamma."
    timeout: 300s
  - do: assert_generation
    name: verify the fresh client committed the generation record and patch notes
    patchNotes: "Update 2: changed alpha, added delta, and removed gamma."
  - do: assert_file_content
    name: verify the fresh client committed current files after the normal update path
    path: "${active_dir}/config/amp-autotest-alpha.txt"
    content: "amp-autotest-alpha-v2\n"
  - do: assert
    name: verify the deferred published tombstone was removed after loader discovery
    that: { file_gone: mods/amp-autotest-removed.jar }
  - do: assert
    name: verify approved first-install cleanup removed the unowned local mod
    that: { file_gone: mods/local-unowned.jar }
  - do: assert_preservation_claim
    name: verify first-install cleanup preserved both removed mods
    packId: "${bootstrap_modpack_id}"
    reason: PLAYER_CONSENT
    count: 2
  - do: disconnect
    name: return from the server to the vanilla title screen before removal
  - use: open_multiplayer
  - do: click
    name: open modpack settings for the installed Pack A
    select: { text: Modpack settings }
  - do: wait_for
    name: show Pack A row without lifecycle actions on the list
    until:
      all:
        - screen: InstalledModpacksScreen
        - element: { text: Pack A, enabled: true }
        - element: { text: Local storage, enabled: true }
        - no_element: { text: Remove }
  - do: click
    name: open active Pack A details
    select: { text: Pack A }
  - do: wait_for
    name: show active Pack A lifecycle actions
    until:
      all:
        - screen: ModpackDetailsScreen
        - element: { text: Remove, enabled: true }
  - do: screenshot
    name: capture active Pack A manager actions
    file: all-pack-manager-actions
  - do: click
    name: open the Pack A removal review
    select: { text: Remove }
  - do: wait_for
    name: show Pack A removal review
    until:
      all:
        - screen: UpdatePreviewScreen
        - element: { text: Remove, enabled: true }
  - do: screenshot
    name: capture Pack A removal review
    file: all-removal-review
  - do: click
    name: accept Pack A removal
    select: { text: Remove }
  - do: wait_for
    name: return to installed pack list after Pack A removal
    until:
      all:
        - screen: InstalledModpacksScreen
        - element: { text: Back, enabled: true }
        - element: { text: Local storage, enabled: true }
        - no_element: { text: Pack A }
  - do: screenshot
    name: capture installed pack list after removal
    file: all-pack-manager-after-removal
  - do: assert
    name: verify Pack A active state was removed
    that: { file_gone: automodpack/client/active-state.json }
  - do: assert
    name: verify Pack A owned projection content was removed
    that: { file_gone: "${active_dir}/config/amp-autotest-alpha.txt" }
  - do: assert
    name: verify Pack A editable overlay was removed
    that: { file_gone: "automodpack/client/overlays/${bootstrap_modpack_id}/config/pack-shared-editable.txt" }
  - do: assert_preservation_claim
    name: verify Pack A removal retained explicit first-install preservation claims
    packId: "${bootstrap_modpack_id}"
    reason: PLAYER_CONSENT
    count: 2
  # Rollback must precede compaction so the runner can select and verify a
  # durable ancestor. Both server-maintenance steps run after client assertions.
  - do: rollback_server_generation
    name: roll back through the real RCON command to a retained server ancestor
    notes: "Release gate rollback: restore the retained ancestor."
    timeout: 180s
  - do: compact_server_history
    name: compact the rolled-back server lineage and verify retained patch notes
    timeout: 180s
  - do: collect_server_objects
    name: collect a valid orphan from the mounted server object store through RCON
    timeout: 120s
  - do: quit
    name: quit the release-gate client

topology:
  server:
    memory: 2G
    env:
      ENABLE_ROLLING_LOGS: "false"
    automodpack:
      config:
        # A fresh bootstrap file has no per-client login secret. Secure mode must
        # reject its anonymous preload and let authenticated login issue the first
        # usable secret before the modpack download.
        validateSecrets: true
        groups:
          main:
            displayName: Core
            description: Required core files
            required: true
            defaultSelected: true
            allowEditsInFiles: ["/config/pack-shared-editable.txt"]
            syncedFiles: ["/config/amp-autotest-alpha.txt", "/config/amp-autotest-beta.json", "/config/amp-autotest-gamma.cfg", "/config/amp-autotest-baseline.json", "/config/amp-autotest-delta.txt", "/config/amp-autotest-marker.json", "/config/pack-a-only.txt", "/config/pack-shared-editable.txt", "/mods/amp-autotest-removed.jar"]
          visual:
            displayName: Visuals
            description: Default client visuals
            category: visuals
            defaultSelected: true
            requires: [main]
            syncedFiles: ["/config/amp-autotest-visual.txt"]
          addon:
            displayName: Addon
            description: Optional addon depending on visuals
            category: extras
            requires: [visual]
            syncedFiles: ["/config/amp-autotest-addon.txt"]
          alternative:
            displayName: Alternative
            description: Mutually exclusive alternative
            category: extras
            breaksWith: [visual]
            syncedFiles: ["/config/amp-autotest-alternative.txt"]
          windows:
            displayName: Windows-only
            description: Platform-filtered fixture
            category: platform
            compatiblePlatforms: [windows]
            syncedFiles: ["/config/amp-autotest-windows.txt"]

