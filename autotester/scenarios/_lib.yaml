# Shared, reusable step sequences (macros). Reference one from a scenario's
# `flow` by name (a bare string) or with `{ use: <name> }`. Files starting with
# `_` are libraries, not scenarios, so the runner never executes this directly.
#
# Steps are declarative: every entry is either a bare verb/macro name, or a
# mapping with a `do:` verb plus its arguments. `${...}` templates expand against
# the scenario context (target, server, modpack, marker, and any captured vars).

# Launch the server and client together (client boots while the server starts),
# capture the server's TLS fingerprint, then connect once both are ready.
boot:
  - do: launch_server
    name: start server
  - do: launch_client
    name: start client (boots in parallel with the server)
  - use: read_server_fingerprint
  - do: wait_server
    name: wait for server to finish loading
  - do: wait_bridge
    name: wait for the client test bridge
  - use: connect_to_server

# The release gate deliberately exercises the file-based bootstrap path. The
# server must publish first so the fixture can write the actual modpack ID and
# live TLS fingerprint before the client starts its Preload phase.
boot_with_bootstrap:
  - do: launch_server
    name: start server for bootstrap-file import
  - do: wait_server
    name: wait for server generation and TLS
  - use: read_server_fingerprint
  - do: seed_bootstrap
    name: write live automodpack-bootstrap.json before client preload
  - do: launch_client
    name: start client with bootstrap file present
  - do: wait_bridge
    name: wait for client preload and test bridge
  - do: assert_bootstrap_import
    name: verify Preload imported and deleted bootstrap state

# Scrape the one-time certificate fingerprint out of the server log into a var.
read_server_fingerprint:
  - do: wait_for
    name: read TLS fingerprint from server log
    timeout: 180s
    until:
      log:
        container: server
        matches: '(?:certificate\s+)?fingerprint[:\s]+([0-9A-Fa-f:]+)'
        capture: { fingerprint: 1 }

connect_to_server:
  - do: connect
    name: connect to the server

# Enter the captured fingerprint on the trust prompt and verify it.
accept_certificate:
  - do: wait_for
    name: wait for the certificate prompt
    timeout: 180s
    until:
      all:
        - element: { role: textfield }
        - element: { text: verify, enabled: true }
  - do: screenshot
    name: capture the shortened certificate fingerprint
    file: certificate-verification
  - do: type
    name: enter the fingerprint
    select: { role: textfield }
    value: "${fingerprint}"
  - do: click
    name: click verify
    select: { text: verify }
  - do: wait_for
    name: transition directly to AutoModpack UI
    timeout: 20s
    until:
      all:
        - screen: [PreparingScreen, FirstConnectScreen, UpdatePreviewScreen, DownloadScreen, FetchScreen, RestartScreen]
        - screen_not: DisconnectedScreen
  - do: wait_for
    name: wait for the certificate to be accepted
    timeout: 20s
    until:
      no_element: { text: verify }

# Accept the first-connection prompt, approve the update preview, and wait for
# the modpack to land on disk.
download_modpack:
  - do: wait_for
    name: wait for the first-connection prompt
    timeout: 90s
    until:
      element: { text: continue, enabled: true }
  - do: screenshot
    name: capture the first-connection prompt
    file: first-connect
  - do: click
    name: accept first connection
    select: { text: continue }
  - do: wait_for
    name: wait for the update preview
    timeout: 90s
    until:
      element: { text: update, enabled: true }
  - do: screenshot
    name: capture the update preview
    file: update-preview
  - do: click
    name: approve update
    select: { text: update }
  - do: wait_file
    name: wait for the modpack marker file
    path: "${active_dir}/${marker}"
    timeout: 300s

# Click the post-download "restart required" button and wait for the client to exit.
restart_client:
  - do: wait_for
    name: wait for the restart screen
    timeout: 20s
    until:
      screen: RestartScreen
  - do: screenshot
    name: capture the completed update summary
    file: update-complete
  - do: click
    name: confirm restart
    select: { role: button, index: 1 }
    timeout: 20s
  - do: wait_client_exit
    name: wait for the client to close

# Offline / client-only boot: pre-stage a modpack into the client game dir and
# launch just the client (no server, no certificate/download dance). Use in
# `mode: client-only` scenarios that assert on the launch log. Deliberately omits
# `wait_bridge` so it stays usable for "loaded then crashed" flows that never
# reach a steady GUI — add it yourself if your assertions drive the GUI.
boot_client_only:
  - do: stage_modpack
    name: pre-stage the modpack into the client game dir
  - do: launch_client
    name: start the client against the pre-staged modpack

# Stop a successful client-only run without waiting minutes for a healthy client to exit on its own.
# The quit verb is intentionally best-effort: cleanup still removes a crashed or bridge-less container.
finish_client_only:
  - do: quit
    name: stop the client after successful assertions

# Relaunch the client and play through to in-game (used to confirm a synced modpack loads).
rejoin:
  - do: launch_client
    name: relaunch the client
  - do: wait_bridge
    name: wait for the client test bridge
  - use: connect_to_server
  - do: wait_join
    name: wait until the player is in-game

# Navigate from the title screen to the vanilla multiplayer screen. The settings
# button under test is injected there, so this keeps the release scenario honest
# about the real entry point instead of calling the screen directly.
open_multiplayer:
  - do: click
    name: open vanilla multiplayer
    select: { text: multiplayer }
    skip_if: { screen: Play Multiplayer }
  - do: wait_for
    name: wait for multiplayer screen
    timeout: 20s
    until: { screen: Play Multiplayer }

open_pack_manager:
  - do: click
    name: open modpack settings from multiplayer
    select: { text: modpack settings }
  - do: wait_for
    name: wait for modpack settings
    until: { screen: ModpackSelectionScreen }
  - do: screenshot
    name: capture modpack settings before manager action
    file: all-pack-settings
  - do: click
    name: open installed pack manager
    select: { text: pack manager }
  - do: wait_for
    name: wait for installed pack manager
    until: { screen: InstalledModpacksScreen }
  - do: screenshot
    name: capture installed pack manager
    file: all-installed-pack-manager
