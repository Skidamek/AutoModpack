id: ui-navigation
description: |
  Exercise first-connection group editing and preview the selection twice. This
  catches previews that consume the confirmation state when the player goes back.
renderClient: true

flow:
  - use: boot
  - use: accept_certificate
  - do: wait_for
    name: wait for the first-connection prompt
    timeout: 90s
    until: { screen: PackConfirmScreen }
  - do: click
    name: open group customization
    select: { text: Customize }
  - do: wait_for
    name: wait for group customization
    until:
      all:
        - screen: ModpackSelectionScreen
        - element: { text: "Visuals (", checked: false }
        - element: { text: "Category: Visuals", checked: false }
  - do: click
    name: select only the child group
    select: { text: "Visuals (", checked: false }
  - do: wait_for
    name: show the category header reflecting its selected child
    until:
      all:
        - element: { text: "Visuals (", checked: true }
        - element: { text: "Category: Visuals", checked: true }
  - do: screenshot
    name: capture explicit child selection
    file: ui-navigation-explicit-child
  - do: click
    name: turn the whole category off through its header
    select: { text: "Category: Visuals", checked: true }
  - do: wait_for
    name: show the header exclusion reaching the child
    until:
      all:
        - element: { text: "Category: Visuals", checked: false }
        - element: { text: "Visuals (", checked: false }
  - do: click
    name: select the category explicitly
    select: { text: "Category: Visuals", checked: false }
  - do: wait_for
    name: show the category carrying its child again
    until:
      all:
        - element: { text: "Category: Visuals", checked: true }
        - element: { text: "Visuals (", checked: true }
  - do: click
    name: restore defaults before checking a named dependency
    select: { text: Defaults }
  - do: click
    name: select a group that requires Visuals
    select: { text: "Extra Five (" }
  - do: wait_for
    name: name the group that requires Visuals
    until: { element: { text: "Visuals (", checked: true } }
  - do: screenshot
    name: capture the named dependency selection
    file: ui-navigation-named-dependency
  - do: click
    name: preview the customized selection
    select: { text: continue }
  - do: wait_for
    name: wait for the first unverified write confirm
    timeout: 90s
    until:
      all:
        - screen: PackConfirmScreen
        - element: { text: do not download, enabled: true }
  - do: click
    name: return to group customization
    select: { text: Customize }
  - do: wait_for
    name: verify group customization is reusable
    until:
      all:
        - screen: ModpackSelectionScreen
        - element: { text: continue, enabled: true }
  - do: click
    name: preview the selection again
    select: { text: continue }
  - do: wait_for
    name: verify the second unverified write confirm opens
    timeout: 90s
    until:
      all:
        - screen: PackConfirmScreen
        - element: { text: download, enabled: false }
  - do: click
    name: return from the second confirm
    select: { text: Customize }
  - do: wait_for
    name: return from customization to first connection
    until: { screen: ModpackSelectionScreen }
  - do: click
    name: return to first connection
    select: { text: back }
  - do: wait_for
    name: verify first connection is still usable
    until:
      all:
        - screen: PackConfirmScreen
        - element: { text: do not download, enabled: true }
  - do: click
    name: cancel first connection
    select: { text: do not download }
  - do: wait_for
    name: verify cancellation returns to multiplayer
    timeout: 20s
    until: { screen: Play Multiplayer }
  - do: quit
    name: quit the client

topology:
  server:
    memory: 2G
    env:
      ENABLE_ROLLING_LOGS: "false"
    automodpack:
      config:
        groups:
          main:
            displayName: Core
            required: true
            defaultSelected: true
            syncedFiles: ["/config/amp-autotest-navigation.txt"]
          extra1:
            displayName: Extra One
            syncedFiles: ["/config/amp-navigation-extra-1.txt"]
          extra2:
            displayName: Extra Two
            syncedFiles: ["/config/amp-navigation-extra-2.txt"]
          extra3:
            displayName: Extra Three
            syncedFiles: ["/config/amp-navigation-extra-3.txt"]
          extra4:
            displayName: Extra Four
            syncedFiles: ["/config/amp-navigation-extra-4.txt"]
          extra5:
            displayName: Extra Five
            requires: [visual]
            syncedFiles: ["/config/amp-navigation-extra-5.txt"]
          visual:
            displayName: Visuals
            category: visuals
            syncedFiles: ["/config/amp-navigation-visual.txt", "/mods/amp-autotest-navigation-visual.jar"]

serverFiles:
  modpackName: amp-autotest
  marker: config/amp-autotest-marker.json
  generations:
    - files:
        - { group: main, path: config/amp-autotest-navigation.txt, content: "navigation\n" }
        - { group: extra1, path: config/amp-navigation-extra-1.txt, content: "extra-1\n" }
        - { group: extra2, path: config/amp-navigation-extra-2.txt, content: "extra-2\n" }
        - { group: extra3, path: config/amp-navigation-extra-3.txt, content: "extra-3\n" }
        - { group: extra4, path: config/amp-navigation-extra-4.txt, content: "extra-4\n" }
        - { group: extra5, path: config/amp-navigation-extra-5.txt, content: "extra-5\n" }
        - { group: visual, path: config/amp-navigation-visual.txt, content: "visual\n" }
        # A metadata-only jar keeps the write confirm unverified, so its honesty lock
        # and acknowledgement are exercised on every preview.
        - { group: visual, path: mods/amp-autotest-navigation-visual.jar, fixture: { modId: amp_autotest_navigation_visual, version: "1.0.0-navigation", marker: navigation } }
