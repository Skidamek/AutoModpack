[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "automodpack-autotest"
version = "0.2.0"
description = "Fast native-first in-game integration tests for AutoModpack"
requires-python = ">=3.11"
dependencies = [
    "filelock>=3.16.0",
    "PyYAML>=6.0.3",
    "zstandard>=0.25.0",
]

[project.scripts]
autotester = "automodpack_autotester.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["automodpack_autotester*"]
namespaces = true
