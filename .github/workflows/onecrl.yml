# Opening the pull request needs the repository setting
# Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
name: OneCRL snapshot

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: onecrl-snapshot
  cancel-in-progress: true

jobs:
  test:
    name: Refresh and test the snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Refresh the bundled snapshot
        run: python3 core/src/main/onecrl/update.py
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never
      - name: Run the core tests
        run: ./gradlew :core:test
      - uses: actions/upload-artifact@v7
        with:
          name: onecrl-snapshot
          path: core/src/main/onecrl/onecrl.json
          retention-days: 1

  pr:
    name: Open a pull request if the snapshot changed
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # actions/checkout hands its token input, github.token by default and never empty, to the action; a plain
      # anonymous fetch of this public repository keeps the write token in the push step alone.
      - name: Check out the tested commit
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      # v8 has no token input default: it reads this run's artifact with the runtime token only.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: onecrl-snapshot
          path: core/src/main/onecrl
      - name: Push the snapshot and open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -- core/src/main/onecrl/onecrl.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh the bundled OneCRL snapshot."
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci/onecrl-snapshot
          gh pr view ci/onecrl-snapshot --json number >/dev/null 2>&1 || gh pr create --title "Refresh the bundled OneCRL snapshot" --body "Weekly Mozilla OneCRL snapshot refresh. Review the diff, then merge." --head ci/onecrl-snapshot
