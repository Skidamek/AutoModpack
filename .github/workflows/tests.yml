name: step.tests

on: [workflow_call]

permissions:
  contents: read

jobs:
  tests:
    name: Windows core tests (JDK ${{ matrix.java }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: [17, 25]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never
          cache-disabled: 'true'
      - name: Run tests
        run: ./gradlew core:test
