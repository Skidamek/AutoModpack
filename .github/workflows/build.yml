name: step.build

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable commit to build
        type: string
        required: true
      targets:
        description: Comma-separated targets to build and expose; empty builds every target
        type: string
        required: false
        default: ''
      artifact_retention_days:
        description: Retention for the packaged jar artifact
        type: number
        required: false
        default: 7
    outputs:
      matrix:
        description: Metadata for the packaged jar
        value: ${{ jobs.build.outputs.matrix }}

permissions:
  contents: read

jobs:
  build:
    name: Build targets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never
          cache-provider: basic
      - name: Build targets
        env:
          TARGETS: ${{ inputs.targets }}
        run: ./gradlew build writeReleaseMatrix --continue "-Pautomodpack.targets=$TARGETS"
      - name: Verify artifacts
        id: matrix
        run: |
          set -euo pipefail
          matrix=$(<build/ci/release-matrix.json)
          mapfile -t expected_files < <(jq -r '.include[].file' <<<"$matrix")
          for file in "${expected_files[@]}"; do
            test -f "merged/$file" || { echo "Missing built jar: $file" >&2; exit 1; }
          done
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Name the one jar
        id: jar
        env:
          MATRIX: ${{ steps.matrix.outputs.matrix }}
        run: |
          set -euo pipefail
          count=$(jq '.include | length' <<<"$MATRIX")
          [[ "$count" == 1 ]] || { echo "Expected exactly one packaged jar, got $count" >&2; exit 1; }
          echo "file=$(jq -r '.include[0].file' <<<"$MATRIX")" >> "$GITHUB_OUTPUT"
      - name: Upload the one jar
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.jar.outputs.file }}
          path: merged/${{ steps.jar.outputs.file }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
