name: In-game Tests

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Autotest scenario or group; blank uses the autotester default
        default: ''
      target:
        description: Target ID or 'all'; blank uses the autotester default
        default: ''

permissions:
  contents: read

concurrency:
  group: ingame-${{ github.ref }}-${{ inputs.scenario }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Select targets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Generate target matrix
        id: matrix
        env:
          SCENARIO: ${{ inputs.scenario }}
          TARGET: ${{ inputs.target }}
        run: |
          args=(--target "${TARGET:-all}")
          if [ -n "$SCENARIO" ]; then args+=(--scenario "$SCENARIO"); fi
          targets=$(uv --project autotester run autotester targets "${args[@]}")
          echo "matrix={\"target\":$targets}" >> "$GITHUB_OUTPUT"

  unit:
    name: Autotester tests
    uses: ./.github/workflows/autotester-tests.yml

  build:
    name: Build instrumented one jar
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never
          cache-provider: basic
      - name: Build instrumented one jar and fixtures
        run: ./gradlew build -Pautomodpack.autotest
      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: ingame-jars
          path: |
            merged/*.jar
            merged/autotest-fixtures/**
          if-no-files-found: error
          retention-days: 1

  ingame:
    name: Test ${{ matrix.target }}
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Set up JDK 17, 21, 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: Download jars
        uses: actions/download-artifact@v8
        with:
          name: ingame-jars
          path: merged
      - name: Run autotest (native zero-docker)
        env:
          SCENARIO: ${{ inputs.scenario }}
          TARGET: ${{ matrix.target }}
        run: |
          args=(--target "$TARGET" --provider local)
          if [ -n "$SCENARIO" ]; then args+=(--scenario "$SCENARIO"); fi
          uv --project autotester run autotester run "${args[@]}"
      - name: Upload target results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ingame-results-${{ matrix.target }}
          path: autotester/out
          if-no-files-found: warn
          retention-days: 7
